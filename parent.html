<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parent portal · Nestopia</title>
<style>:root{--ink:#2E2440;--muted:#6E6680;--line:#ECE6F3;--bg:#F8F5FC;--card:#fff;--plum:#462D5B;--plum-soft:#EDE6F5;--lav:#EFE9FB;--mint:#E3F4EC;--mint-ink:#2F7A52;--peach:#FDEBDD;--peach-ink:#A5532A;--sky:#E3EEFB;--sky-ink:#2F5E99;--butter:#FFF4D6;--butter-ink:#9A6A10;--rose:#FCE7EE;--rose-ink:#A23C62;--sage:#3F8A4B;--sage-soft:#E4F1E6;--red:#B4473A;--amber:#A86C12}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
a{color:var(--plum)}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:20px;color:var(--plum);text-decoration:none}
main{max-width:1060px;margin:0 auto;padding:18px 16px 100px}
h1{color:var(--plum);font-size:clamp(24px,5vw,32px);margin:4px 0 6px}
h2{font-size:19px;margin:0 0 10px;color:var(--plum)}
.ar{display:block;color:var(--muted);font-size:.92em}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:14px;box-shadow:0 2px 10px rgba(70,45,91,.04)}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:11px 18px;background:var(--plum);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--card);color:var(--plum);border:2px solid var(--line)}.btn.small{padding:7px 12px;font-size:14px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;background:#fff}
label{display:grid;gap:4px;font-weight:700;margin-bottom:10px}
.muted{color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ok{background:var(--mint);color:var(--mint-ink);border-radius:14px;padding:10px 14px;font-weight:700}.err{background:#F8E1DE;color:var(--red);border-radius:14px;padding:10px 14px;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}.tab{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;cursor:pointer;color:var(--ink)}.tab[aria-selected="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:15px}th{color:var(--muted);font-size:13px}
.big{font-size:30px;font-weight:800}
.chip{display:inline-block;font-size:13px;font-weight:800;border-radius:99px;padding:3px 10px;margin:2px;background:var(--mint);color:var(--mint-ink)}.chip.inc{background:var(--peach);color:var(--peach-ink)}
.news{border-bottom:1px solid var(--line);padding:12px 0}.news:last-child{border-bottom:0}.news p{white-space:pre-line;margin:6px 0 0}
.bub{max-width:85%;padding:10px 14px;border-radius:16px;margin:6px 0;white-space:pre-line}.bub.me{margin-left:auto;background:var(--plum);color:#fff;border-bottom-right-radius:4px}.bub.them{background:var(--sky);border-bottom-left-radius:4px}.bub small{display:block;opacity:.75;font-size:12px;margin-top:4px}
.dot{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--rose-ink);color:#fff;font-size:12px;font-weight:800;text-align:center}
/* new layout */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}
.side{position:sticky;top:76px;align-self:start;display:grid;gap:4px}
.nv{display:flex;align-items:center;gap:10px;font:inherit;font-weight:800;font-size:15.5px;color:var(--ink);background:none;border:0;border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;width:100%}
.nv .i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px}
.nv[aria-current="page"]{background:var(--card);box-shadow:0 2px 10px rgba(70,45,91,.08)}
.bottom{display:none}
.kidsw{display:flex;gap:6px;flex-wrap:wrap}
.kidb{display:flex;align-items:center;gap:6px;font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px 4px 6px;cursor:pointer;color:var(--ink)}
.kidb .a{font-size:22px}.kidb[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-soft)}
.hbtn{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;color:var(--plum);position:relative}
.hbtn .dot{position:absolute;top:-6px;right:-6px}
.hello{border-radius:24px;padding:20px 22px;margin-bottom:14px;background:linear-gradient(135deg,var(--lav),var(--sky));display:flex;gap:16px;align-items:center}
.hello .av{font-size:60px;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tile{border-radius:20px;padding:16px 18px;border:0}
.t-mint{background:var(--mint)}.t-peach{background:var(--peach)}.t-sky{background:var(--sky)}.t-butter{background:var(--butter)}.t-lav{background:var(--lav)}.t-rose{background:var(--rose)}
.todo{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid rgba(0,0,0,.06);cursor:pointer}
.todo:first-of-type{border-top:0}.todo .e{font-size:24px}.todo b{display:block}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.quick button{font:inherit;font-weight:800;border:0;border-radius:18px;padding:14px;cursor:pointer;color:var(--ink);display:grid;gap:4px;justify-items:center;text-align:center}
.quick button span{font-size:26px}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(46,36,64,.35);display:flex;justify-content:flex-end}
.drawer .in{background:var(--bg);width:min(420px,92vw);height:100%;overflow:auto;padding:18px}
[dir="rtl"] .bub.me{margin-left:0;margin-right:auto}[dir="rtl"] .bub.them{margin-left:auto}[dir="rtl"] td,[dir="rtl"] th,[dir="rtl"] .nv{text-align:right}
@media (max-width:820px){.shell{grid-template-columns:1fr}.side{display:none}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom button{font:inherit;font-size:11.5px;font-weight:800;background:none;border:0;color:var(--muted);display:grid;justify-items:center;gap:2px;cursor:pointer;padding:4px 0}
  .bottom button span{font-size:22px}.bottom button[aria-current="page"]{color:var(--plum)}}
@media print{header,.side,.bottom,.no-print{display:none!important}.shell{display:block}}
</style>
</head>

{ const c = new URLSearchParams(location.search).get("code"); if (c) { try { localStorage.setItem("nest_pcode", c.toUpperCase()); } catch (_) {} history.replaceState(null, "", location.pathname); } try { pend = localStorage.getItem("nest_pcode"); } catch (_) {} }

async function loadKids(){ const { data } = await sb.rpc("parent_my_children"); kids = data || []; }
// ---------- Language: English or العربية ----------
let LANG = (() => { try { return localStorage.getItem("nest_lang") || "en"; } catch (_) { return "en"; } })();
const AR = /[\u0600-\u06FF]/, LAT = /[A-Za-z]/;

  document.documentElement.lang = LANG; document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  root.querySelectorAll(".ar").forEach(s => { s.style.display = LANG === "ar" ? "inline" : "none"; if (LANG === "ar") { let n = s.previousSibling; while (n && n.nodeType === 3) { if (!n._orig) n._orig = n.nodeValue; n.nodeValue = ""; n = n.previousSibling; } } });

  document.getElementById("anf").onsubmit = async e => { e.preventDefault(); const btn = document.getElementById("asb"), from = document.getElementById("af").value, to = document.getElementById("at").value || from;
    if (to < from) return alert("The end date must be after the start date. · يجب أن يكون تاريخ النهاية بعد البداية.");
    btn.disabled = true; btn.textContent = "Sending… · جارٍ الإرسال";
    let docPath = null, docName = null; const f = document.getElementById("ad").files[0];
    try {
      if (f) { if (f.size > 10 * 1024 * 1024) throw new Error("Please choose a file smaller than 10 MB."); const { data: folder } = await sb.rpc("parent_doc_folder", { p_student: String(cur) }); if (!folder) throw new Error("Not linked");
        docPath = `${folder}/note-${Date.now()}-${f.name.replace(/[^\w.\-]+/g, "_")}`; const up = await sb.storage.from("attendance-docs").upload(docPath, f); if (up.error) throw up.error; docName = f.name; }
      const { error } = await sb.rpc("parent_absence_note", { p_student: String(cur), p_from: from, p_to: to, p_reason: document.getElementById("ar").value, p_doc_path: docPath, p_doc_name: docName }); if (error) throw error;
      attendance(); setTimeout(() => alert("Thank you. The school has your note. · شكرًا، تم إرسال الملاحظة إلى المدرسة."), 50);
    } catch (err) { btn.disabled = false; btn.textContent = "Send to the school · إرسال"; alert(err.message || err); } };
}
async function behaviour(){
  const p = document.getElementById("pane"), b = view.behaviour || [], m = b.filter(x => x.kind === "merit"), inc = b.filter(x => x.kind === "incident");
  let ex = {}; try { const r = await sb.rpc("parent_merit_extras", { p_student: String(PREVIEW || cur) }); ex = r.data || {}; } catch (_) {}
  const cfg = ex.config || {}, EM = Object.assign({ "Kindness": "💛", "Effort": "💪", "Respect": "🤝", "Responsibility": "🌟", "Excellent work": "🏆", "Leadership": "🦁", "Helping others": "🤲", "Honesty": "🕊️" }, cfg.emojis || {});
  const BD = cfg.badges && cfg.badges.length ? cfg.badges : [[10, "🥉", "Bronze"], [25, "🥈", "Silver"], [50, "🥇", "Gold"], [100, "🏆", "Champion"]];
  const pts = m.reduce((s, x) => s + (x.points || 1), 0), by = Object.entries(m.reduce((a, x) => (a[x.category] = (a[x.category] || 0) + (x.points || 1), a), {})).sort((a, c) => c[1] - a[1]);
  let badge = null; BD.forEach(x => { if (pts >= x[0]) badge = x; }); const nx = BD.find(x => pts < x[0]), prev = badge ? badge[0] : 0;
  const av = ex.avatar || "⭐", first = (view.name || "").split(" ")[0];
  p.innerHTML = `<div class="card" style="text-align:center;background:linear-gradient(160deg,#FFF8E7,#F1E9FA)"><div style="font-size:72px;line-height:1">${av}</div>
      <h2 style="margin:6px 0 0">${esc(first)}’s stars · نجوم ${esc(first)}</h2><p style="font-size:44px;font-weight:800;margin:4px 0;color:#B07A1E">⭐ ${pts}</p>
      ${badge ? `<p style="margin:0;font-size:20px">${badge[1]} <b>${esc(badge[2])} badge</b></p>` : ""}
      ${nx ? `<p class="muted" style="margin:8px 0 4px">${nx[0] - pts} more star${nx[0] - pts === 1 ? "" : "s"} to the ${nx[1]} ${esc(nx[2])} badge · ${nx[0] - pts} نجمة للشارة التالية</p><div style="height:14px;border-radius:99px;background:#EEE6F6;overflow:hidden;max-width:360px;margin:0 auto"><i style="display:block;height:100%;width:${Math.round((pts - prev) / (nx[0] - prev) * 100)}%;background:linear-gradient(90deg,#F7B733,#FC4A1A)"></i></div>` : '<p style="margin:8px 0 0">🎉 Every badge earned! · حصل على جميع الشارات!</p>'}</div>
    <div class="card"><h2>What ${esc(first)} earned stars for · سبب النجوم</h2>${by.length ? `<p style="margin:0">${by.map(([k, n]) => `<span class="chip" style="font-size:15px;padding:6px 12px">${EM[k] || "⭐"} ${esc(k)} · ${n}</span>`).join("")}</p>` : '<p class="muted" style="margin:0">No stars yet this year.</p>'}
      ${m.length ? `<table style="margin-top:12px">${m.slice(0, 10).map(x => `<tr><td style="white-space:nowrap">${dshort(x.day)}</td><td><span style="font-size:20px">${EM[x.category] || "⭐"}</span> ${esc(x.category)} · +${x.points || 1} ⭐</td></tr>`).join("")}</table>` : ""}</div>
    ${(await (async () => { if (PREVIEW) return ""; let it = []; try { const r = await sb.rpc("parent_bh_items", { p_student: String(cur) }); it = r.data || []; } catch (_) {} if (!it.length) return "";
      return `<div class="card"><h2>🤝 Agreements and meetings · الاتفاقات والاجتماعات</h2>${it.map(x => `<div style="border-top:1px solid var(--line);padding:10px 0"><b>${x.kind === "agreement" ? "✍️" : "🤝"} ${esc(x.title)}</b> <span class="muted">· ${dshort(x.date)}</span>${x.data && x.data.targets ? `<ul style="margin:6px 0">${x.data.targets.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}${x.data && x.data.text ? `<p style="margin:6px 0;white-space:pre-line">${esc(x.data.text)}</p>` : ""}
        ${x.ack ? `<p class="ok" style="margin:6px 0 0;padding:6px 10px">✅ You confirmed this · تم التأكيد</p>` : `<button class="btn small" data-ack="${esc(x.id)}">I have read this and agree · قرأت وأوافق</button>`}</div>`).join("")}</div>`; })())}
    ${(await (async () => { if (PREVIEW) return ""; let cs = []; try { const r = await sb.rpc("parent_bh_cards", { p_student: String(cur) }); cs = r.data || []; } catch (_) {} if (!cs.length) return "";
      const SMF = ["😟", "😐", "😊"];
      return cs.map(c => { const days = [...new Set((c.scores || []).map(x => x.d))].sort().reverse().slice(0, 5);
        return `<div class="card"><h2>📅 Daily card · البطاقة اليومية</h2><p class="muted" style="margin-top:0">${esc(c.targets.join(" · "))}</p>
          ${days.length ? days.map(d => { const sc = c.scores.filter(x => x.d === d), pct = Math.round(sc.reduce((a, x) => a + x.v, 0) / (2 * sc.length) * 100), dr = (c.days || []).find(x => x.d === d) || {};
            return `<div style="border-top:1px solid var(--line);padding:10px 0"><b>${dshort(d)}</b> · <b style="color:${pct >= c.goal ? "var(--sage)" : "var(--amber)"}">${pct}%</b>${dr.star ? " ⭐ <b>Star day! · يوم مميز</b>" : ""}
              <table style="margin-top:6px"><tr><th></th>${c.targets.map(t => `<th style="font-size:12px">${esc(t)}</th>`).join("")}</tr>${c.sessions.map(se => `<tr><td style="font-size:13px">${esc(se)}</td>${c.targets.map((t, ti) => { const v = sc.find(x => x.s === se && x.t === ti); return `<td style="font-size:20px;text-align:center">${v ? SMF[v.v] : "·"}</td>`; }).join("")}</tr>`).join("")}</table>
              ${dr.c ? `<p style="margin:6px 0 0">💬 ${esc(dr.c)}</p>` : ""}${dr.seen ? '<p class="muted" style="margin:6px 0 0">👍 Seen</p>' : `<button class="btn small" data-seen="${esc(c.id)}|${d}" style="margin-top:6px">👍 Seen · تمت المشاهدة</button>`}</div>`; }).join("") : '<p class="muted" style="margin:0">No scores yet.</p>'}</div>`; }).join(""); })())}
    ${view.show && view.show.incidents ? `<div class="card"><h2>Incidents · المخالفات</h2>${inc.length ? `<table>${inc.slice(0, 10).map(x => `<tr><td>${dshort(x.day)}</td><td><span class="chip inc">${esc({ low: "Low", medium: "Medium", high: "High" }[x.level] || "")}</span> ${esc(x.category)}</td></tr>`).join("")}</table><p class="muted" style="margin:10px 0 0">If you have questions, please contact your child’s teacher.</p>` : '<p class="muted" style="margin:0">None this year. 🎉</p>'}</div>` : ""}`;
  p.querySelectorAll("[data-seen]").forEach(b => b.onclick = async () => { const [cid, d] = b.dataset.seen.split("|"); const { error } = await sb.rpc("parent_card_seen", { p_card: cid, p_day: d }); if (error) return alert(error.message); behaviour(); });
  p.querySelectorAll("[data-ack]").forEach(b => b.onclick = async () => { const { error } = await sb.rpc("parent_bh_ack", { p_item: b.dataset.ack }); if (error) return alert(error.message); behaviour(); });
}

function calendar(){
  const p = document.getElementById("pane"), ev = view.events || [];
  p.innerHTML = `<div class="card"><h2>Coming up · القادم</h2>${ev.length ? `<table>${ev.map(e => `<tr><td style="white-space:nowrap">${dshort(e.start)}${e.end && e.end !== e.start ? " – " + dshort(e.end) : ""}</td><td><b>${esc(e.title)}</b>${e.time ? ` <span class="muted">· ${esc(e.time)}</span>` : ""}</td></tr>`).join("")}</table>` : '<p class="muted" style="margin:0">Nothing in the next two months.</p>'}</div>`;
}
async function start(){
  if (PREVIEW) { const { data: { session } } = await sb.auth.getSession(); if (!session) return authView("in", "Please sign in with your staff account to preview."); hr.innerHTML = '<a class="btn ghost small" href="parents.html">← Back to Nestopia</a>'; kids = [{ id: PREVIEW, name: "" }]; tab = "reports"; return show(PREVIEW); }
  if (pend && !window.INVITE) { try { const { data } = await sb.rpc("parent_code_info", { p_code: pend }); if (data) window.INVITE = data; } catch (_) {} }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return authView(window.INVITE ? "up" : "in");
  hr.innerHTML = "";
  await loadKids();
  // linked automatically from an invite link
  if (pend) { const { data: { user } } = await sb.auth.getUser(); const { data: nm, error } = await sb.rpc("parent_link_child", { p_code: pend, p_name: (user.user_metadata || {}).full_name || "", p_rel: "" });
    try { localStorage.removeItem("nest_pcode"); } catch (_) {} pend = null; window.INVITE = null;
    if (!error) { await loadKids(); const k = kids.find(x => x.name.split(" ")[0] === nm); return show(k ? k.id : null, nm + " has been added. · تمت إضافة " + nm); } }
  show();
}
// keep the chosen language on everything that appears, including sign-in screens and pop-ups
{ let t = null; new MutationObserver(() => { clearTimeout(t); t = setTimeout(() => applyLang(document.body), 30); }).observe(document.body, { childList: true, subtree: true }); }
sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") newPassword(); });
start();
