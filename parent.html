<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parent portal · Nestopia</title>
<style>
:root{--ink:#2A2233;--muted:#6B6475;--line:#E6E0EE;--bg:#F7F4FA;--card:#fff;--plum:#462D5B;--plum-soft:#EDE6F5;--sage:#3F8A4B;--sage-soft:#E4F1E6;--red:#B4473A;--amber:#A86C12}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:20px;color:var(--plum);text-decoration:none}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{color:var(--plum);font-size:clamp(24px,5vw,32px);margin:4px 0 6px}
h2{font-size:19px;margin:0 0 10px;color:var(--plum)}
.ar{display:block;color:var(--muted);font-size:.92em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:11px 18px;background:var(--plum);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--card);color:var(--plum);border:2px solid var(--line)}.btn.small{padding:7px 12px;font-size:14px}
input,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:#fff}
label{display:grid;gap:4px;font-weight:700;margin-bottom:10px}
.muted{color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ok{background:var(--sage-soft);color:var(--sage);border-radius:12px;padding:10px 14px;font-weight:700}.err{background:#F8E1DE;color:var(--red);border-radius:12px;padding:10px 14px;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}.tab{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;cursor:pointer;color:var(--ink)}.tab[aria-selected="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:15px}th{color:var(--muted);font-size:13px}
.big{font-size:30px;font-weight:800}
.chip{display:inline-block;font-size:13px;font-weight:800;border-radius:99px;padding:3px 10px;margin:2px;background:var(--sage-soft);color:var(--sage)}
.chip.inc{background:#FBEBD5;color:#8A5A10}
.news{border-bottom:1px solid var(--line);padding:12px 0}.news:last-child{border-bottom:0}.news p{white-space:pre-line;margin:6px 0 0}
.bub{max-width:85%;padding:10px 14px;border-radius:16px;margin:6px 0;white-space:pre-line}.bub.me{margin-left:auto;background:var(--plum);color:#fff;border-bottom-right-radius:4px}.bub.them{background:var(--plum-soft);border-bottom-left-radius:4px}
.bub small{display:block;opacity:.75;font-size:12px;margin-top:4px}
textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:#fff}
.dot{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:800;text-align:center}
</style>
</head>
<body>
<header><a class="brand" href="parent.html">Nestopia <span style="font-weight:500;font-size:14px;color:var(--muted)">· Parents · أولياء الأمور</span></a><div id="hr"></div></header>
<main id="app"><p class="muted">Loading…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://gvhzbxpgebgjnegdiijp.supabase.co";
const SUPABASE_KEY = "sb_publishable_aEQ4MVt00kNu8PaVtrNnqQ_9guhxPYM";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app"), hr = document.getElementById("hr");
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dshort = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
let kids = [], cur = null, view = null, tab = "news", term = null, pend = null;
const PREVIEW = new URLSearchParams(location.search).get("preview");
{ const c = new URLSearchParams(location.search).get("code"); if (c) { try { localStorage.setItem("nest_pcode", c.toUpperCase()); } catch (_) {} history.replaceState(null, "", location.pathname); } try { pend = localStorage.getItem("nest_pcode"); } catch (_) {} }
const msg = (t, ok) => t ? `<p class="${ok ? "ok" : "err"}">${esc(t)}</p>` : "";

function authView(mode, m, ok){
  hr.innerHTML = "";
  const up = mode === "up";
  const inv = window.INVITE;
  app.innerHTML = `<h1>${up ? "Create a parent account" : "Parent portal"}<span class="ar" dir="rtl" lang="ar">${up ? "إنشاء حساب وليّ أمر" : "بوابة أولياء الأمور"}</span></h1>
    ${inv ? `<div class="card" style="border-left:5px solid var(--plum)"><b>👋 ${esc(inv.school)} has invited you to follow ${esc(inv.child)}’s learning.</b><span class="ar" dir="rtl" lang="ar">دعتك المدرسة لمتابعة تعلّم ${esc(inv.child)}.</span><p class="muted" style="margin:6px 0 0">${up ? "Create your account below. " + esc(inv.child) + " will be added automatically." : "Sign in, or create an account if you don’t have one yet. " + esc(inv.child) + " will be added automatically."}</p></div>` : ""}
    <div class="card"><p class="muted" style="margin-top:0">News from school, messages with teachers, report cards, attendance and merits.<span class="ar" dir="rtl" lang="ar">أخبار المدرسة، والرسائل مع المعلمين، والتقارير، والحضور، والنقاط.</span></p>${msg(m, ok)}
      <form id="f">${up ? `<label>Your name · الاسم <input id="nm" required></label>` : ""}<label>Email · البريد الإلكتروني <input id="em" type="email" required autocomplete="email"></label>
        <label>Password · كلمة المرور <input id="pw" type="password" required minlength="8" autocomplete="${up ? "new-password" : "current-password"}"></label>
        <button class="btn">${up ? "Create account · إنشاء الحساب" : "Sign in · تسجيل الدخول"}</button></form>
      <p class="row" style="margin:14px 0 0">${up ? `<a href="#" id="sw">I already have an account · لديّ حساب</a>` : `<a href="#" id="sw">Create a parent account · إنشاء حساب</a> · <a href="#" id="fg">Forgot password? · نسيت كلمة المرور؟</a>`}</p></div>
    <p class="muted">School staff: please use <a href="./">nestopia.school</a>. · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>`;
  document.getElementById("sw").onclick = e => { e.preventDefault(); authView(up ? "in" : "up"); };
  const fg = document.getElementById("fg"); if (fg) fg.onclick = async e => { e.preventDefault(); const em = document.getElementById("em").value.trim(); if (!em) return authView("in", "Type your email first, then tap “Forgot password?”."); await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname }); authView("in", "We’ve emailed you a link to choose a new password. · أرسلنا لك رابطًا لتغيير كلمة المرور.", true); };
  document.getElementById("f").onsubmit = async e => { e.preventDefault(); const em = document.getElementById("em").value.trim(), pw = document.getElementById("pw").value;
    if (up) { const { data, error } = await sb.auth.signUp({ email: em, password: pw, options: { data: { full_name: document.getElementById("nm").value.trim(), account: "parent" }, emailRedirectTo: location.origin + location.pathname } });
      if (error) return authView("up", error.message); if (!data.session) return authView("in", "Almost done: open the email we sent you and tap the link to confirm your account. · افتح البريد الذي أرسلناه لتأكيد حسابك.", true); return start(); }
    const { error } = await sb.auth.signInWithPassword({ email: em, password: pw }); if (error) return authView("in", "That email or password isn’t right. · البريد أو كلمة المرور غير صحيحة."); start(); };
}
function newPassword(){
  app.innerHTML = `<h1>Choose a new password<span class="ar" dir="rtl" lang="ar">اختر كلمة مرور جديدة</span></h1><div class="card"><form id="f"><label>New password · كلمة المرور الجديدة <input id="pw" type="password" minlength="8" required></label><button class="btn">Save · حفظ</button></form></div>`;
  document.getElementById("f").onsubmit = async e => { e.preventDefault(); const { error } = await sb.auth.updateUser({ password: document.getElementById("pw").value }); if (error) return alert(error.message); start(); };
}
function linkView(m, ok){
  app.innerHTML = `<h1>Add your child<span class="ar" dir="rtl" lang="ar">أضف طفلك</span></h1><div class="card">${msg(m, ok)}
    <p class="muted" style="margin-top:0">Type the parent code your child’s school gave you (it starts with P). Add each child with their own code.<span class="ar" dir="rtl" lang="ar">اكتب رمز وليّ الأمر الذي أعطتك إياه المدرسة. لكل طفل رمز خاص.</span></p>
    <form id="f"><label>Parent code · رمز وليّ الأمر <input id="cd" required maxlength="8" style="text-transform:uppercase;letter-spacing:.15em;font-weight:800;max-width:240px"></label>
      <label>I am the child’s… · صلتي بالطفل <select id="rl"><option>Mother · الأم</option><option>Father · الأب</option><option>Guardian · وليّ الأمر</option><option>Other · أخرى</option></select></label>
      <button class="btn">Add my child · أضف طفلي</button> ${kids.length ? '<button type="button" class="btn ghost" id="bk">Back · رجوع</button>' : ""}</form></div>`;
  const bk = document.getElementById("bk"); if (bk) bk.onclick = () => show(cur);
  document.getElementById("f").onsubmit = async e => { e.preventDefault(); const { data: { user } } = await sb.auth.getUser();
    const { data, error } = await sb.rpc("parent_link_child", { p_code: document.getElementById("cd").value, p_name: (user.user_metadata || {}).full_name || "", p_rel: document.getElementById("rl").value.split(" · ")[0] });
    if (error) return linkView(error.message); await loadKids(); const k = kids.find(x => x.name.split(" ")[0] === data) || kids[kids.length - 1]; show(k ? k.id : null, data + " has been added. · تمت إضافة " + data); };
}
async function loadKids(){ const { data } = await sb.rpc("parent_my_children"); kids = data || []; }
async function show(id, note){
  if (!kids.length) return linkView(note);
  cur = id || kids[0].id; const { data, error } = PREVIEW ? await sb.rpc("staff_parent_preview", { p_student: String(PREVIEW) }) : await sb.rpc("parent_child_view", { p_student: String(cur) });
  if (error) { app.innerHTML = `<div class="card">${msg(error.message)}</div>`; return; }
  view = data; const S = view.show || {};
  const tabs = [["news", "📢 News · الأخبار", !PREVIEW], ["messages", "💬 Messages · الرسائل", !PREVIEW], ["reports", "Reports · التقارير", S.reports], ["attendance", "Attendance · الحضور", S.attendance], ["behaviour", "Merits · النقاط", S.merits || S.incidents], ["calendar", "Calendar · التقويم", S.calendar]].filter(t => t[2]);
  if (!tabs.some(t => t[0] === tab)) tab = tabs[0] ? tabs[0][0] : null;
  app.innerHTML = `${PREVIEW ? '<p class="ok" style="background:#FBEBD5;color:#8A5A10">👀 Preview: this is what the parents of this student see (news and messages are not shown in the preview).</p>' : ""}${note ? msg(note, true) : ""}<div class="row" style="justify-content:space-between${PREVIEW ? ";display:none" : ""}">${kids.length > 1 ? `<div class="row">${kids.map(k => `<button class="tab" aria-selected="${String(k.id) === String(cur)}" data-kid="${esc(k.id)}">${esc(k.name.split(" ")[0])}</button>`).join("")}</div>` : "<span></span>"}<button class="btn ghost small" id="add">+ Add another child · إضافة طفل</button></div>
    <h1>${esc(view.name)}${view.arabic_name ? ` <span class="muted" dir="rtl" lang="ar" style="font-size:.7em">${esc(view.arabic_name)}</span>` : ""}</h1>
    <p class="muted" style="margin:0 0 6px">${esc([view.class, view.school].filter(Boolean).join(" · "))}${(view.teachers || []).length ? " · " + esc(view.teachers.join(", ")) : ""}</p>
    ${(view.conferences || []).length ? `<div class="card" style="border-left:5px solid var(--plum)"><b>📅 Parent–teacher conferences are open for booking.</b><span class="ar" dir="rtl" lang="ar">الحجز متاح للقاءات أولياء الأمور.</span>${view.conferences.map(c => `<p style="margin:8px 0 0"><a class="btn small" href="book.html?c=${esc(c.code)}">Book: ${esc(c.title)} · احجز</a></p>`).join("")}</div>` : ""}
    ${tabs.length ? `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${tab === k}" data-tab="${k}">${l}</button>`).join("")}</div><div id="pane"></div>` : '<div class="card"><p class="muted" style="margin:0">Your child’s school hasn’t shared anything here yet.</p></div>'}`;
  app.querySelectorAll("[data-kid]").forEach(b => b.onclick = () => show(b.dataset.kid));
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; show(cur); });
  document.getElementById("add").onclick = () => linkView();
  if (tab) ({ news, messages, reports, attendance, behaviour, calendar })[tab]();
}
async function news(){
  const p = document.getElementById("pane"); p.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
  let sv = []; try { const r = await sb.rpc("parent_surveys", { p_student: String(cur) }); sv = r.data || []; } catch (_) {}
  const { data, error } = await sb.rpc("parent_news", { p_student: String(cur) });
  if (error) { p.innerHTML = '<div class="card"><p class="muted" style="margin:0">News isn’t available yet.</p></div>'; return; }
  p.innerHTML = sv.map(s => `<div class="card" style="border-left:5px solid var(--plum)"><h2>📋 ${esc(s.title)}</h2><p class="muted" style="margin-top:0">${esc(s.intro || "A short survey from your child’s school. Your answers are anonymous.")}<span class="ar" dir="rtl" lang="ar">استبيان قصير من المدرسة. إجاباتك مجهولة الهوية.</span></p>
      <form data-sv="${esc(s.id)}">${(s.questions || []).map((q, i) => `<div style="margin:12px 0"><b>${i + 1}. ${esc(q.text)}</b><div class="row" style="margin-top:6px">${q.type === "scale" ? ["Strongly disagree · لا أوافق بشدة", "Disagree · لا أوافق", "Not sure · غير متأكد", "Agree · أوافق", "Strongly agree · أوافق بشدة"].map((l, k) => `<label style="display:flex;gap:5px;align-items:center;font-weight:500;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:0"><input type="radio" name="${q.id}" value="${k + 1}" style="width:auto"> ${l}</label>`).join("") : q.type === "yesno" ? ["Yes · نعم", "No · لا"].map((l, k) => `<label style="display:flex;gap:5px;align-items:center;font-weight:500;border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin:0"><input type="radio" name="${q.id}" value="${1 - k}" style="width:auto"> ${l}</label>`).join("") : `<textarea name="${q.id}" rows="2" maxlength="800"></textarea>`}</div></div>`).join("")}
      <button class="btn">Send · إرسال</button></form></div>`).join("") + `<div class="card"><h2>📢 News from school · أخبار المدرسة</h2>${(data || []).length ? data.map(n => `<div class="news"><b>${n.pinned ? "📌 " : ""}${esc(n.title)}</b><span class="muted" style="font-size:13px"> · ${new Date(n.at).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}${n.by ? " · " + esc(n.by) : ""}</span><p>${esc(n.body)}</p></div>`).join("") : '<p class="muted" style="margin:0">No news yet. · لا توجد أخبار بعد.</p>'}</div>`;
  p.querySelectorAll("[data-sv]").forEach(f => f.onsubmit = async e => { e.preventDefault(); const s = sv.find(x => x.id === f.dataset.sv), a = {};
    (s.questions || []).forEach(q => { if (q.type === "text") { const v = (f[q.id] && f[q.id].value || "").trim(); if (v) a[q.id] = v; } else { const c = f.querySelector(`input[name="${q.id}"]:checked`); if (c) a[q.id] = +c.value; } });
    if (!Object.keys(a).length) return alert("Please answer at least one question. · يُرجى الإجابة عن سؤال واحد على الأقل.");
    const { error: er } = await sb.rpc("parent_submit_survey", { p_survey: s.id, p_student: String(cur), p_answers: a }); if (er) return alert(er.message);
    f.closest(".card").innerHTML = '<p class="ok" style="margin:0">💛 Thank you for your answers. · شكرًا لإجاباتك.</p>'; });
}
async function messages(open){
  const p = document.getElementById("pane"); p.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
  const { data, error } = await sb.rpc("parent_threads", { p_student: String(cur) });
  if (error) { p.innerHTML = '<div class="card"><p class="muted" style="margin:0">Messages aren’t available yet.</p></div>'; return; }
  const th = data.threads || [], tch = data.teachers || [];
  if (open) {
    const { data: t } = await sb.rpc("parent_thread", { p_thread: open });
    p.innerHTML = `<div class="card"><button class="btn ghost small" id="bk">← All messages · كل الرسائل</button><h2 style="margin:12px 0 6px">${esc(t.subject)}</h2>
      ${t.messages.map(m => `<div class="bub ${m.from === "parent" ? "me" : "them"}">${esc(m.body)}<small>${esc(m.from === "parent" ? "You" : m.name || "School")} · ${new Date(m.at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</small></div>`).join("")}
      <form id="rf" style="margin-top:12px"><textarea id="rb" rows="3" placeholder="Write a reply · اكتب ردًا" required></textarea><p style="margin:8px 0 0"><button class="btn">Send · إرسال</button></p></form></div>`;
    document.getElementById("bk").onclick = () => messages();
    document.getElementById("rf").onsubmit = async e => { e.preventDefault(); const { error: er } = await sb.rpc("parent_send", { p_student: String(cur), p_thread: open, p_teacher: null, p_subject: null, p_body: document.getElementById("rb").value });
      if (er) return alert(er.message); sb.functions.invoke("nestopia-mail", { body: { action: "pmsg", id: open } }).catch(() => {}); messages(open); };
    return;
  }
  p.innerHTML = `<div class="card"><h2>💬 Messages · الرسائل</h2><p class="muted" style="margin-top:0">Write to your child’s teacher or to the school office. You’ll get an email when they reply.<span class="ar" dir="rtl" lang="ar">راسل معلّم طفلك أو إدارة المدرسة. سيصلك بريد عند الرد.</span></p>
      <form id="nf"><label>To · إلى <select id="to">${tch.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("")}<option value="">School office · إدارة المدرسة</option></select></label>
        <label>Subject · الموضوع <input id="sj" maxlength="150" placeholder="For example: Homework question · سؤال عن الواجب"></label>
        <label>Message · الرسالة <textarea id="bd" rows="4" required></textarea></label><button class="btn">Send · إرسال</button></form></div>
    ${th.length ? `<div class="card"><h2>Your conversations · محادثاتك</h2><table>${th.map(t => `<tr><td><a href="#" data-th="${esc(t.id)}"><b>${esc(t.subject)}</b></a><br><span class="muted">With ${esc(t.with)} · ${new Date(t.last).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</span></td><td style="text-align:right">${t.unread ? `<span class="dot">${t.unread}</span>` : ""}</td></tr>`).join("")}</table></div>` : ""}`;
  p.querySelectorAll("[data-th]").forEach(a => a.onclick = e => { e.preventDefault(); messages(a.dataset.th); });
  document.getElementById("nf").onsubmit = async e => { e.preventDefault(); const to = document.getElementById("to").value;
    const { data: tid, error: er } = await sb.rpc("parent_send", { p_student: String(cur), p_thread: null, p_teacher: to || null, p_subject: document.getElementById("sj").value, p_body: document.getElementById("bd").value });
    if (er) return alert(er.message); sb.functions.invoke("nestopia-mail", { body: { action: "pmsg", id: tid } }).catch(() => {}); messages(tid); };
}
function reports(){
  const p = document.getElementById("pane"), terms = view.terms || [], cms = view.comments || [];
  const has = terms.map((t, k) => cms.some(c => String(c.term) === String(k)));
  if (term == null || !has[term]) term = has.lastIndexOf(true);
  if (term < 0) { p.innerHTML = '<div class="card"><p class="muted" style="margin:0">No report has been shared yet this year.<span class="ar" dir="rtl" lang="ar">لم يتم نشر أي تقرير بعد.</span></p></div>'; return; }
  const lab = lv => lv == null ? "" : ((view.scale || [])[lv] ?? lv);
  p.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Report · ${esc(terms[term])}</h2><div class="row">${terms.map((t, k) => has[k] ? `<button class="tab" aria-selected="${k === term}" data-term="${k}">${esc(t)}</button>` : "").join("")}<button class="btn ghost small" onclick="window.print()">🖨 Print</button></div></div>
    <table style="margin-top:10px"><tr><th>Subject · المادة</th><th>Level · المستوى</th><th>Comment · التعليق</th></tr>${(view.subjects || []).map(sub => { const rows = (sub.strands || []).map(st => [st, cms.find(c => c.strand === st.id && String(c.term) === String(term))]).filter(x => x[1]);
      return rows.length ? `<tr><td colspan="3" style="background:var(--plum-soft);font-weight:800">${esc(sub.name)}</td></tr>` + rows.map(([st, c]) => `<tr><td><b>${esc(st.name)}</b></td><td style="text-align:center">${esc(lab(c.level))}</td><td ${sub.lang === "ar" ? 'dir="rtl" lang="ar"' : ""}>${esc(c.text)}</td></tr>`).join("") : ""; }).join("")}</table></div>`;
  p.querySelectorAll("[data-term]").forEach(b => b.onclick = () => { term = +b.dataset.term; reports(); });
}
async function attendance(){
  const p = document.getElementById("pane"), a = view.attendance || { days: 0 };
  let notes = []; if (!PREVIEW) try { const r = await sb.rpc("parent_absence_notes", { p_student: String(cur) }); notes = r.data || []; } catch (_) {}
  const NS = { pending: "⏳ Waiting for the school · بانتظار المدرسة", accepted: "✅ Accepted: authorised absence · تم القبول", declined: "❌ Not accepted · لم يُقبل" };
  const today = new Date().toISOString().slice(0, 10);
  const noteCard = `<div class="card"><h2>📨 Tell the school about an absence · إبلاغ المدرسة عن غياب</h2>
      <p class="muted" style="margin-top:0">For an absence today, one that has happened, or one that’s planned (for example a medical appointment). Attach a medical note or letter if you have one.<span class="ar" dir="rtl" lang="ar">أرفق تقريرًا طبيًا أو خطابًا إن وُجد.</span></p>
      <form id="anf"><div class="row"><label style="flex:1;min-width:150px">From · من <input type="date" id="af" value="${today}" required></label><label style="flex:1;min-width:150px">To · إلى <input type="date" id="at" value="${today}" required></label></div>
        <label>Reason · السبب <input id="ar" maxlength="500" required placeholder="For example: unwell with a fever · مثال: مريض"></label>
        <label>Medical note or letter (optional) · تقرير طبي أو خطاب <input type="file" id="ad" accept="image/*,.pdf,.doc,.docx"></label>
        <button class="btn" id="asb">Send to the school · إرسال</button></form></div>
    ${notes.length ? `<div class="card"><h2>Your absence notes · ملاحظاتك</h2><table>${notes.map(n => `<tr><td style="white-space:nowrap">${dshort(n.from)}${n.to !== n.from ? " – " + dshort(n.to) : ""}</td><td>${esc(n.reason)}${n.doc ? ` <span class="muted">· 📎 ${esc(n.doc)}</span>` : ""}<br><span class="muted" style="font-size:13px">${NS[n.status] || ""}</span></td></tr>`).join("")}</table></div>` : ""}`;
  const pc = a.days ? Math.round(a.in / a.days * 100) : null;
  p.innerHTML = `<div class="card"><h2>Attendance this school year · الحضور هذا العام</h2>${a.days ? `<p class="big" style="margin:0;color:${pc >= 95 ? "var(--sage)" : pc >= 90 ? "var(--amber)" : "var(--red)"}">${pc}%</p><p class="muted" style="margin:4px 0 0">${a.days - a.in} day${a.days - a.in === 1 ? "" : "s"} absent · late ${a.late} time${a.late === 1 ? "" : "s"} · out of ${a.days} school days</p>
      ${(a.recent || []).length ? `<table style="margin-top:12px">${a.recent.map(r => `<tr><td>${dshort(r.day)}</td><td>${{ late: "Late · متأخر", absent: "Unauthorised absence · غياب بدون عذر", excused: "Authorised absence · غياب بعذر" }[r.status] || r.status}</td></tr>`).join("")}</table>` : ""}
      <p class="muted" style="margin:12px 0 0">Every school day counts. 95% or more is the goal. · كل يوم دراسي مهم.</p>` : '<p class="muted" style="margin:0">No registers yet this year.</p>'}</div>` + (PREVIEW ? "" : noteCard);
  if (PREVIEW) return;
  document.getElementById("anf").onsubmit = async e => { e.preventDefault(); const btn = document.getElementById("asb"), from = document.getElementById("af").value, to = document.getElementById("at").value || from;
    if (to < from) return alert("The end date must be after the start date. · يجب أن يكون تاريخ النهاية بعد البداية.");
    btn.disabled = true; btn.textContent = "Sending… · جارٍ الإرسال";
    let docPath = null, docName = null; const f = document.getElementById("ad").files[0];
    try {
      if (f) { if (f.size > 10 * 1024 * 1024) throw new Error("Please choose a file smaller than 10 MB."); const { data: folder } = await sb.rpc("parent_doc_folder", { p_student: String(cur) }); if (!folder) throw new Error("Not linked");
        docPath = `${folder}/note-${Date.now()}-${f.name.replace(/[^\w.\-]+/g, "_")}`; const up = await sb.storage.from("attendance-docs").upload(docPath, f); if (up.error) throw up.error; docName = f.name; }
      const { error } = await sb.rpc("parent_absence_note", { p_student: String(cur), p_from: from, p_to: to, p_reason: document.getElementById("ar").value, p_doc_path: docPath, p_doc_name: docName }); if (error) throw error;
      attendance(); setTimeout(() => alert("Thank you. The school has your note. · شكرًا، تم إرسال الملاحظة إلى المدرسة."), 50);
    } catch (err) { btn.disabled = false; btn.textContent = "Send to the school · إرسال"; alert(err.message || err); } };
}
function behaviour(){
  const p = document.getElementById("pane"), b = view.behaviour || [], m = b.filter(x => x.kind === "merit"), inc = b.filter(x => x.kind === "incident");
  const pts = m.reduce((s, x) => s + (x.points || 1), 0), by = Object.entries(m.reduce((a, x) => (a[x.category] = (a[x.category] || 0) + (x.points || 1), a), {})).sort((a, c) => c[1] - a[1]);
  p.innerHTML = `<div class="card"><h2>⭐ Merits this year · النقاط هذا العام</h2><p class="big" style="margin:0;color:var(--sage)">⭐ ${pts}</p>${by.length ? `<p style="margin:8px 0 0">${by.map(([k, n]) => `<span class="chip">${esc(k)} · ${n}</span>`).join("")}</p>` : '<p class="muted">No merits yet.</p>'}
    ${m.length ? `<table style="margin-top:12px">${m.slice(0, 10).map(x => `<tr><td>${dshort(x.day)}</td><td>⭐ ${x.points || 1} · ${esc(x.category)}</td></tr>`).join("")}</table>` : ""}</div>
    ${view.show && view.show.incidents ? `<div class="card"><h2>Incidents · المخالفات</h2>${inc.length ? `<table>${inc.slice(0, 10).map(x => `<tr><td>${dshort(x.day)}</td><td><span class="chip inc">${esc({ low: "Low", medium: "Medium", high: "High" }[x.level] || "")}</span> ${esc(x.category)}</td></tr>`).join("")}</table><p class="muted" style="margin:10px 0 0">If you have questions, please contact your child’s teacher.</p>` : '<p class="muted" style="margin:0">None this year. 🎉</p>'}</div>` : ""}`;
}
function calendar(){
  const p = document.getElementById("pane"), ev = view.events || [];
  p.innerHTML = `<div class="card"><h2>Coming up · القادم</h2>${ev.length ? `<table>${ev.map(e => `<tr><td style="white-space:nowrap">${dshort(e.start)}${e.end && e.end !== e.start ? " – " + dshort(e.end) : ""}</td><td><b>${esc(e.title)}</b>${e.time ? ` <span class="muted">· ${esc(e.time)}</span>` : ""}</td></tr>`).join("")}</table>` : '<p class="muted" style="margin:0">Nothing in the next two months.</p>'}</div>`;
}
async function start(){
  if (PREVIEW) { const { data: { session } } = await sb.auth.getSession(); if (!session) return authView("in", "Please sign in with your staff account to preview."); hr.innerHTML = '<a class="btn ghost small" href="parents.html">← Back to Nestopia</a>'; kids = [{ id: PREVIEW, name: "" }]; tab = "reports"; return show(PREVIEW); }
  if (pend && !window.INVITE) { try { const { data } = await sb.rpc("parent_code_info", { p_code: pend }); if (data) window.INVITE = data; } catch (_) {} }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return authView(window.INVITE ? "up" : "in");
  hr.innerHTML = `<button class="btn ghost small" id="out">Sign out · خروج</button>`;
  document.getElementById("out").onclick = async () => { await sb.auth.signOut(); authView("in"); };
  await loadKids();
  // linked automatically from an invite link
  if (pend) { const { data: { user } } = await sb.auth.getUser(); const { data: nm, error } = await sb.rpc("parent_link_child", { p_code: pend, p_name: (user.user_metadata || {}).full_name || "", p_rel: "" });
    try { localStorage.removeItem("nest_pcode"); } catch (_) {} pend = null; window.INVITE = null;
    if (!error) { await loadKids(); const k = kids.find(x => x.name.split(" ")[0] === nm); return show(k ? k.id : null, nm + " has been added. · تمت إضافة " + nm); } }
  show();
}
sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") newPassword(); });
start();
</script>
