.big{font-size:30px;font-weight:800}

/* new layout */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}
.side{position:sticky;top:76px;align-self:start;display:grid;gap:4px}
.nv{display:flex;align-items:center;gap:10px;font:inherit;font-weight:800;font-size:15.5px;color:var(--ink);background:none;border:0;border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;width:100%}

.kidsw{display:flex;gap:6px;flex-wrap:wrap}

const nlUrl = (path, bucket) => `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${String(path).split("/").map(encodeURIComponent).join("/")}`;

const nlDay = s => s ? dshort(String(s).slice(0, 10)) : "";

function nlMedia(files, bucket, links){
  files = files || []; links = links || []; if (!files.length && !links.length) return "";
  const sp = (path, attr) => `data-nsp="${esc(path)}" data-nsb="${esc(bucket)}" data-nsa="${attr}"`;
  return `<div class="nlm">${files.map(f => { const ty = f.type || "", nm = f.name || "";
    if (/^video\//.test(ty) || /\.(mp4|mov|webm|m4v)$/i.test(nm)) return `<video ${sp(f.path, "src")} controls playsinline preload="metadata"></video>`;
    if (/^audio\//.test(ty) || /\.(m4a|mp3|wav|ogg|weba)$/i.test(nm)) return `<span class="nla">🎤 <audio ${sp(f.path, "src")} controls preload="metadata"></audio></span>`;
    if (/^image\//.test(ty) || /\.(png|jpe?g|gif|webp|heic)$/i.test(nm)) return `<a ${sp(f.path, "href")} target="_blank" rel="noopener"><img ${sp(f.path, "src")} alt="" loading="lazy"></a>`;
    return `<a class="btn ghost small" ${sp(f.path, "href")} target="_blank" rel="noopener">📎 ${esc(nm)}</a>`; }).join("")}
    ${links.map(l => `<a class="btn ghost small" href="${esc(l.url)}" target="_blank" rel="noopener">🔗 ${esc(l.label || l.url)}</a>`).join("")}</div>`;
}

  if (sub.n === "hw") { const hw = items.filter(i => i.kind === "homework").sort((a, b) => String(a.on_date || "9999").localeCompare(String(b.on_date || "9999")));
    const st = i => { const h = hins[i.id];
      if (h && h.status === "approved") return `<span class="pill" style="background:var(--mint);color:var(--mint-ink)">✅ ${L("Handed in", "تم التسليم")}</span>`;
      if (h && h.status === "pending") return `<span class="pill" style="background:var(--butter);color:var(--butter-ink)">⏳ ${L("Handed in, waiting for the teacher", "تم التسليم، بانتظار المعلّم")}</span>`;
      if (h && h.status === "returned") return `<span class="pill" style="background:var(--peach);color:var(--peach-ink)">↩️ ${L("The teacher asked for changes", "طلب المعلّم بعض التعديلات")}</span>`;
      return `<span class="pill" style="background:var(--rose);color:var(--rose-ink)">${i.on_date && i.on_date < today0 ? L("Not handed in", "لم يُسلَّم") : L("Not handed in yet", "لم يُسلَّم بعد")}</span>`; };
    body = hw.length ? hw.map(i => card(`<div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap"><b style="font-size:17px">${i.sub_kind === "revision" ? "🔁" : "📝"} ${esc(i.title)}</b>${st(i)}</div>
        ${i.on_date ? `<p class="muted" style="margin:4px 0 0">${L("Due", "موعد التسليم")}: ${nlDay(i.on_date)}</p>` : ""}${i.body ? `<p style="margin:8px 0 0">${nlText(i.body)}</p>` : ""}${nlMedia(i.files, "nestlings", i.links)}`)).join("")
      : card(`<p style="margin:0">🎉 ${L("No homework at the moment.", "لا توجد واجبات حاليًا.")}</p>`); }
  if (sub.n === "msgs") { const m = items.filter(i => i.kind === "message");
    body = m.length ? m.map(i => card(`<p class="muted" style="margin:0 0 6px">${nlAgo(i.created_at)}</p><p style="margin:0;font-size:17px">${nlText(i.body || "")}</p>${nlMedia(i.files, "nestlings", i.links)}`)).join("")
      : card(`<p style="margin:0">💬 ${L("No class messages yet.", "لا توجد رسائل للصف بعد.")}</p>`); }
  if (sub.n === "mat") { const m = items.filter(i => i.kind === "material");
    body = m.length ? m.map(i => card(`<p class="muted" style="margin:0 0 4px">${nlAgo(i.created_at)}</p><b style="font-size:17px">📚 ${esc(i.title)}</b>${i.body ? `<p style="margin:6px 0 0">${nlText(i.body)}</p>` : ""}${nlMedia(i.files, "nestlings", i.links)}`)).join("")
      : card(`<p style="margin:0">📚 ${L("No materials yet.", "لا توجد مواد بعد.")}</p>`); }
  if (sub.n === "cal") { const CAT = { holiday: "🏖️", trip: "🚌", assessment: "✏️", event: "🎉", reminder: "🔔" }, rows = [];
    (N.events || []).forEach(e => rows.push({ d: String(e.start).slice(0, 10), end: e.end && String(e.end).slice(0, 10) !== String(e.start).slice(0, 10) ? String(e.end).slice(0, 10) : null, ic: CAT[String(e.category || "").toLowerCase()] || "🏫", t: e.title, note: L("School", "المدرسة") }));
    items.forEach(i => { if (i.kind === "event" && i.on_date) rows.push({ d: i.on_date, ic: CAT[i.sub_kind] || "🎉", t: i.title, note: i.body || "" });
      if (i.kind === "homework" && i.on_date) rows.push({ d: i.on_date, ic: "📝", t: i.title, note: L("Homework due", "موعد تسليم واجب") }); });
    const up = rows.filter(r => (r.end || r.d) >= today0).sort((a, b) => a.d.localeCompare(b.d));
    body = card(up.length ? `<table>${up.map(r => `<tr><td style="white-space:nowrap;vertical-align:top;padding:6px 10px 6px 0"><b>${nlDay(r.d)}</b>${r.end ? `<br><span class="muted">→ ${nlDay(r.end)}</span>` : ""}</td><td style="padding:6px 0">${r.ic} <b>${esc(r.t)}</b>${r.note ? `<br><span class="muted">${esc(r.note)}</span>` : ""}</td></tr>`).join("")}</table>`
      : `<p style="margin:0">🌤️ ${L("Nothing on the calendar yet.", "لا شيء في التقويم بعد.")}</p>`); }
  p.innerHTML = `<div class="card tile t-butter"><h2 style="margin:0 0 6px">🐣 ${L(`${first}’s Nestlings`, "بوابة الطالب")}</h2>
      <p style="margin:0">${L(`Nestlings is ${first}’s learning space at school: homework, class messages and the work ${first} shares.`, "بوابة الطالب هي مساحة التعلّم الخاصة بطفلك: الواجبات ورسائل الصف والأعمال التي يشاركها.")}</p>
      ${N.code && !PREVIEW ? `<p style="margin:10px 0 0">🔑 ${L("Sign-in code for home", "رمز الدخول من البيت")}: <b style="font-size:20px;letter-spacing:.15em">${esc(N.code)}</b> · <a href="nestlings/?c=${encodeURIComponent(N.code)}" target="_blank" rel="noopener">${L("Open Nestlings", "افتح بوابة الطالب")} ↗</a></p>
        <p class="muted" style="margin:4px 0 0">${L("Please keep this code private: it opens your child’s nest.", "يُرجى الحفاظ على سرية هذا الرمز.")}</p>` : !N.code ? `<p class="muted" style="margin:8px 0 0">${L("The teacher hasn’t created a Nestlings code for your child yet.", "لم يُنشئ المعلّم رمز الدخول لطفلك بعد.")}</p>` : ""}</div>
    <div class="tabs" role="tablist">${T.map(([k, ic, l]) => `<button class="tab" aria-selected="${sub.n === k}" data-n="${k}">${ic} ${l}</button>`).join("")}</div>
    ${body}`;
  p.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { sub.n = b.dataset.n; nestlingsTab(); });
  applyLang(p); nlResolve(p);
}
// private Nestlings files: links that expire after 1 hour, only for files this parent may see
const NLSIGNED = new Map();
async function nlResolve(root){
  const els = [...root.querySelectorAll("[data-nsp]")]; if (!els.length) return;
  const now = Date.now(), need = {};
  els.forEach(el => { const c = NLSIGNED.get(el.dataset.nsb + "|" + el.dataset.nsp); if (!c || c.exp < now) (need[el.dataset.nsb] = need[el.dataset.nsb] || new Set()).add(el.dataset.nsp); });
  for (const b of Object.keys(need)) { const all = [...need[b]];
    for (let i = 0; i < all.length; i += 80) { const chunk = all.slice(i, i + 80); let urls = null;
      try { const { data, error } = await sb.functions.invoke("nestlings-media", { body: { bucket: b, paths: chunk } }); if (!error && data && data.urls) urls = data.urls; } catch (_) {}
      chunk.forEach(p => NLSIGNED.set(b + "|" + p, urls ? { url: urls[p] || "", exp: now + 50 * 60e3 } : { url: nlUrl(p, b), exp: now + 2 * 60e3 })); } }
  els.forEach(el => { const c = NLSIGNED.get(el.dataset.nsb + "|" + el.dataset.nsp); if (c && c.url) el.setAttribute(el.dataset.nsa, c.url); else if (c) { el.style.opacity = ".4"; el.removeAttribute("href"); } });
}
function calendar(){
  const p = document.getElementById("pane"), ev = view.events || [];
  p.innerHTML = `<div class="card"><h2>Coming up · القادم</h2>${ev.length ? `<table>${ev.map(e => `<tr><td style="white-space:nowrap">${dshort(e.start)}${e.end && e.end !== e.start ? " – " + dshort(e.end) : ""}</td><td><b>${esc(e.title)}</b>${e.time ? ` <span class="muted">· ${esc(e.time)}</span>` : ""}</td></tr>`).join("")}</table>` : '<p class="muted" style="margin:0">Nothing in the next two months.</p>'}</div>`;
}
async function start(){
  if (PREVIEW) { const { data: { session } } = await sb.auth.getSession(); if (!session) return authView("in", "Please sign in with your staff account to preview."); hr.innerHTML = '<a class="btn ghost small" href="parents.html">← Back to Nestopia</a>'; kids = [{ id: PREVIEW, name: "" }]; tab = "reports"; return show(PREVIEW); }
  if (pend && !window.INVITE) { try { const { data } = await sb.rpc("parent_code_info", { p_code: pend }); if (data) window.INVITE = data; } catch (_) {} }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return authView(window.INVITE ? "up" : "in");
  hr.innerHTML = "";
  await loadKids();
  try { sb.rpc("parent_seen").then(() => {}, () => {}); } catch (_) {}
  // linked automatically from an invite link
  if (pend) { const { data: { user } } = await sb.auth.getUser(); const { data: nm, error } = await sb.rpc("parent_link_child", { p_code: pend, p_name: (user.user_metadata || {}).full_name || "", p_rel: "" });
    try { localStorage.removeItem("nest_pcode"); } catch (_) {} pend = null; window.INVITE = null;
    if (!error) { await loadKids(); const k = kids.find(x => x.name.split(" ")[0] === nm); return show(k ? k.id : null, nm + " has been added. · تمت إضافة " + nm); } }
  show();
}
// keep the chosen language on everything that appears, including sign-in screens and pop-ups
{ let t = null; new MutationObserver(() => { clearTimeout(t); t = setTimeout(() => applyLang(document.body), 30); }).observe(document.body, { childList: true, subtree: true }); }
sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") newPassword(); });
start();
