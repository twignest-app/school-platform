<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nestlings · Nestopia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

:root{--plum:#462D5B;--plum-2:#6A4B85;--plum-soft:#EDE6F5;--sage:#5E8455;--sage-soft:#E6EFE2;--amber:#A86C12;--amber-soft:#FBF0DC;--red:#B4473A;--red-soft:#F8E4E1;--blue:#4E6FB8;--blue-soft:#E4EBF8;--bg:#F7F4FB;--card:#FFFFFF;--ink:#2E2140;--muted:#6F6680;--line:#E4DDEE;--empty:#ECE7F3;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--plum:#CDB9EA;--plum-2:#DCCCF2;--plum-soft:#352A45;--sage:#A7C59A;--sage-soft:#26331F;--amber:#E6B566;--amber-soft:#3A2E17;--red:#E8897C;--red-soft:#3D2220;--blue:#9DB4E8;--blue-soft:#1E2A40;--bg:#17131D;--card:#221C2B;--ink:#F1ECF7;--muted:#B2A8C2;--line:#382F45;--empty:#2C2536;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--plum-2);outline-offset:2px}
h1,h2,h3,.btn,.brand{font-family:"Poppins","Nunito",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;font-size:22px;color:var(--plum);text-decoration:none}
header .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
main{max-width:1200px;margin:0 auto;padding:24px 20px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:18px}
.card h2{margin:0 0 8px;font-size:20px;color:var(--plum);font-weight:600}
.btn{border:0;background:var(--plum);color:#fff;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--bg);color:var(--plum);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.note{color:var(--muted);font-size:14px}
.msg{border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:600;font-size:14px;background:var(--red-soft);color:var(--red)}
.ptitle{margin:0 0 4px;font-weight:600;font-size:26px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.metric span{display:block;font-size:13px;color:var(--muted);font-weight:700}
.metric b{display:block;font-size:26px;color:var(--plum);font-family:Poppins,Nunito,sans-serif;font-weight:600;line-height:1.3}
.tablewrap{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:8px;min-width:100%}
table.grid th{font-size:13px;color:var(--muted);text-align:left;font-weight:700;padding:4px}
.cell{width:100%;min-width:150px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;display:block}
.cell:hover{border-color:var(--plum-2)}
.cell b{font-size:20px;font-family:Poppins,Nunito,sans-serif;font-weight:600;color:var(--plum)}
.cell small{display:block;color:var(--muted);font-size:12.5px}
.cell.none{cursor:default;color:var(--muted);background:var(--bg)}
.cell.on{outline:3px solid var(--plum-2)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--empty);margin:6px 0 4px}
.bar i{display:block;height:100%}
.bar .a{background:var(--sage)}.bar .t{background:var(--amber)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
h3.strand{font-size:16px;font-weight:600;margin:18px 0 6px;color:var(--ink)}
.obj{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.obj:last-child{border-bottom:0}
.st{font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px;justify-self:start}
.st.n{background:var(--empty);color:var(--muted)}.st.p{background:var(--amber-soft);color:var(--amber)}.st.t{background:var(--blue-soft);color:var(--blue)}.st.a{background:var(--sage-soft);color:var(--sage)}
.obj small{display:block;color:var(--muted);font-size:12.5px}
.sec{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.sec b{display:block;font-size:16px;color:var(--ink)}
@media (max-width:640px){.obj{grid-template-columns:1fr}.sec{text-align:left}}

.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.set .card{margin:0}
.set a.btn{margin-top:8px}

  .kcard .t{font-family:Poppins,sans-serif;font-weight:700;font-size:16pt}

</style></head><body>
<header><a class="brand" href="./" id="brand">Nestopia</a><div class="who" id="who"></div></header>
<main id="app"><p class="note">Loading…</p></main>
<div id="cards" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="hub.js?v=21"></script>
<script>
const PLATFORM = "Nestopia";
const SUPABASE_URL = "https://gvhzbxpgebgjnegdiijp.supabase.co";
const SUPABASE_KEY = "sb_publishable_aEQ4MVt00kNu8PaVtrNnqQ_9guhxPYM";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app"), who = document.getElementById("who");
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = m => { const t = document.getElementById("toast"); t.textContent = m; t.style.opacity = 1; setTimeout(() => { t.style.opacity = 0; }, 2600); };
const LINK = "nestopia.school/nestlings";
const BIRD = `<svg viewBox="0 0 120 112" width="64" aria-hidden="true"><path d="M40 20C56 2 86 8 90 36c3 18 14 30 22 42-16 7-38 12-56 8C34 82 23 62 27 44c2-10 6-18 13-24z" fill="#7BB3E6"/><path d="M58 52c14-9 34 4 42 24-12 6-30 6-40-2-8-6-8-16-2-22z" fill="#8FC0EC" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/><path d="M42 32q6-7 12 0" stroke="#2A3550" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M29 33 11 28l16 11z" fill="#F2B544"/><path d="M27 39 11 44l18 0z" fill="#F7C863"/><path d="M56 86l-5 16M46 103h12M70 87l2 15M65 103h13" stroke="#E8A13A" stroke-width="3.2" stroke-linecap="round"/></svg>`;
const natural = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
let S, P, LEAD, CLASSES = [], STUDS = [], CODES = {}, SETS = {};

(async () => {
  const { data: { session } } = await sb.auth.getSession(); if (!session) { location.href = "./"; return; }
  const { data: p } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (!p || !p.school_id) { location.href = "./"; return; }
  P = p; LEAD = ["school_lead", "coordinator", "admin"].includes(p.role);
  who.innerHTML = `<span>${esc(p.full_name || p.email)}</span><a class="btn ghost small" href="./">← ${PLATFORM}</a>`;
  const { data: s } = await sb.from("schools").select("*").eq("id", p.school_id).single(); S = s;
  hubInit("nestlings");
  app.innerHTML = `<div class="phead"><div class="nl-hero">${BIRD}<div><h1 class="ptitle">Nestlings</h1>
      <p class="note" style="margin:0"><i>Think, try, learn to fly.</i> · The student portal for ${esc(s.name)}, Pre-K to Grade 5.</p></div></div>
      <a class="btn ghost" href="nestlings/" target="_blank" rel="noopener">Open Nestlings ↗</a></div>
    <section class="card"><h2>How students sign in</h2>
      <p style="margin:0">Each student has their own <b>Nestlings code</b>. They go to <b>${LINK}</b>, type their code and tap <b>Hop in, let’s begin!</b> Their device remembers them until they sign out.</p>
      <p class="note" style="margin:6px 0 0">For Pre-K and KG, the teacher or a parent can type the code. Keep codes private: each one opens one child’s nest. If a code gets shared, press <b>New code</b> and the old one stops working.</p>
      <p class="note" style="margin:6px 0 0">Teachers open Nestlings with their usual Nestopia email and password, using the <b>Teachers</b> button.</p></section>
    <section id="codesBox"><p class="note">Loading your classes…</p></section>`;
  load();
})();

async function load(){
  const box = document.getElementById("codesBox");
  let cls;
  if (LEAD) cls = await sb.from("classes").select("id,name").eq("school_id", S.id);
  else { const ct = await sb.from("class_teachers").select("class_id").eq("teacher_id", P.id);
    const ids = [...new Set((ct.data || []).map(x => x.class_id))];
    cls = ids.length ? await sb.from("classes").select("id,name").in("id", ids) : { data: [] }; }
  if (cls.error) { box.innerHTML = `<div class="card"><p class="note" style="color:var(--red);margin:0">Classes couldn’t be loaded: ${esc(cls.error.message)}</p></div>`; return; }
  CLASSES = (cls.data || []).sort((a, b) => natural(a.name, b.name));
  const ids = CLASSES.map(c => c.id);
  const [st, cd, se] = await Promise.all([
    ids.length ? sb.from("students").select("id,full_name,class_id").in("class_id", ids).eq("archived", false).order("full_name") : { data: [] },
    sb.from("nestling_codes").select("student_id,code"),
    sb.from("nestling_class_settings").select("class_id,approve_posts,student_messages")]);
  if (st.error) { box.innerHTML = `<div class="card"><p class="note" style="color:var(--red);margin:0">Students couldn’t be loaded: ${esc(st.error.message)}</p></div>`; return; }
  if (cd.error || se.error) { const e = cd.error || se.error;
    box.innerHTML = `<div class="card"><p class="note" style="color:var(--red);margin:0">Nestlings couldn’t be loaded. ${/relation|does not exist|schema cache/i.test(e.message) ? "The Nestlings setup hasn’t been added to the database yet." : esc(e.message)}</p></div>`; return; }
  STUDS = st.data || []; CODES = {}; SETS = {};
  (cd.data || []).forEach(c => { CODES[String(c.student_id)] = c.code; });
  (se.data || []).forEach(x => { SETS[String(x.class_id)] = x; });
  const missingAll = STUDS.filter(s => !CODES[String(s.id)]).length;
  box.innerHTML = `
    ${LEAD && CLASSES.length ? `<section class="card"><div class="nl-head"><h2 style="margin:0">Whole school</h2>
        <span class="nl-acts"><button class="btn" id="mkAll">${missingAll ? `Create codes for ${missingAll} student${missingAll === 1 ? "" : "s"}` : "Every student has a code"}</button>
        <button class="btn ghost" id="prAll">Print all cards</button><button class="btn ghost" id="csvAll">Download list</button></span></div>
        <p class="note" style="margin:0">Teachers can also do this for their own classes below.</p></section>` : ""}
    ${!CLASSES.length ? `<div class="card"><p class="note" style="margin:0">${LEAD ? "No classes yet. Add classes in TwigNest first." : "You’re not linked to any classes yet. Ask a school leader to add you to your classes."}</p></div>` : ""}
    ${CLASSES.map(classCard).join("")}`;
  bind();
  const m = location.hash.match(/class=([^&]+)/); if (m) { const el = document.getElementById("cls-" + decodeURIComponent(m[1])); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
}

function classCard(c){
  const list = STUDS.filter(s => String(s.class_id) === String(c.id)), miss = list.filter(s => !CODES[String(s.id)]).length;
  const set = SETS[String(c.id)] || { approve_posts: true, student_messages: false };
  return `<section class="card nl-cls" id="cls-${esc(c.id)}"><div class="nl-head"><h2 style="margin:0">${esc(c.name)} <span class="note" style="font-size:14px;font-weight:600">· ${list.length} student${list.length === 1 ? "" : "s"}</span></h2>
      <span class="nl-acts">${miss ? `<button class="btn small" data-mk="${esc(c.id)}">Create ${miss} code${miss === 1 ? "" : "s"}</button>` : ""}
        <button class="btn ghost small" data-pr="${esc(c.id)}">Print class cards</button><button class="btn ghost small" data-csv="${esc(c.id)}">Download list</button></span></div>
    <div class="nl-set" data-set="${esc(c.id)}">
      <label><input type="checkbox" data-k="approve" ${set.approve_posts ? "checked" : ""}> I approve students’ posts before parents see them</label>
      <label><input type="checkbox" data-k="msgs" ${set.student_messages ? "checked" : ""}> Students can send me messages</label>
      <span class="note" data-saved></span></div>
    ${list.length ? `<table><thead><tr><th>Student</th><th>Nestlings code</th><th></th></tr></thead><tbody>
      ${list.map(s => { const k = CODES[String(s.id)]; return `<tr><td>${esc(s.full_name)}</td>
        <td>${k ? `<span class="nl-code">${esc(k)}</span>` : '<span class="note">No code yet</span>'}</td>
        <td>${k ? `<button class="btn ghost small" data-one="${esc(s.id)}">Print card</button> <button class="btn ghost small" data-reset="${esc(s.id)}">New code</button>`
               : `<button class="btn small" data-mk1="${esc(s.id)}">Create code</button>`}</td></tr>`; }).join("")}
      </tbody></table>` : '<p class="note" style="margin:0">No students in this class yet.</p>'}</section>`;
}

function bind(){
  const run = async (btn, fn) => { btn.disabled = true; try { await fn(); } finally { btn.disabled = false; } };
  const make = async args => { const { data, error } = await sb.rpc("nestlings_make_codes", args);
    if (error) return alert("Codes weren’t created: " + error.message); toast(`${data || 0} code${data === 1 ? "" : "s"} created`); load(); };
  const all = document.getElementById("mkAll"); if (all) all.onclick = () => run(all, () => make({}));
  const pa = document.getElementById("prAll"); if (pa) pa.onclick = () => printCards(STUDS);
  const ca = document.getElementById("csvAll"); if (ca) ca.onclick = () => csv(STUDS, S.name + " Nestlings codes");
  app.querySelectorAll("[data-mk]").forEach(b => b.onclick = () => run(b, () => make({ p_class: b.dataset.mk })));
  app.querySelectorAll("[data-mk1]").forEach(b => b.onclick = () => run(b, () => make({ p_student: b.dataset.mk1 })));
  app.querySelectorAll("[data-pr]").forEach(b => b.onclick = () => printCards(STUDS.filter(s => String(s.class_id) === b.dataset.pr)));
  app.querySelectorAll("[data-csv]").forEach(b => b.onclick = () => { const c = CLASSES.find(x => String(x.id) === b.dataset.csv);
    csv(STUDS.filter(s => String(s.class_id) === b.dataset.csv), (c ? c.name : "Class") + " Nestlings codes"); });
  app.querySelectorAll("[data-one]").forEach(b => b.onclick = () => printCards(STUDS.filter(s => String(s.id) === b.dataset.one)));
  app.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => { const s = STUDS.find(x => String(x.id) === b.dataset.reset);
    if (!confirm(`Give ${s ? s.full_name : "this student"} a new code? Their old code will stop working and they’ll need to sign in again.`)) return;
    run(b, async () => { const { error } = await sb.rpc("nestlings_reset_code", { p_student: b.dataset.reset });
      if (error) return alert("The code wasn’t changed: " + error.message); toast("New code ready"); load(); }); });
  app.querySelectorAll("[data-set]").forEach(row => row.querySelectorAll("input").forEach(i => i.onchange = async () => {
    const cid = row.dataset.set, ap = row.querySelector('[data-k="approve"]').checked, ms = row.querySelector('[data-k="msgs"]').checked, note = row.querySelector("[data-saved]");
    note.textContent = "Saving…";
    const { error } = await sb.rpc("nestlings_save_settings", { p_class: cid, p_approve: ap, p_messages: ms });
    if (error) { note.textContent = ""; i.checked = !i.checked; return alert("This setting wasn’t saved: " + error.message); }
    SETS[cid] = { approve_posts: ap, student_messages: ms }; note.textContent = "Saved"; setTimeout(() => { note.textContent = ""; }, 1800); }));
}

const className = id => { const c = CLASSES.find(x => String(x.id) === String(id)); return c ? c.name : ""; };

function csv(list, name){
  const rows = [["Student", "Class", "Nestlings code", "Sign in at"]].concat(list.slice().sort((a, b) => natural(className(a.class_id), className(b.class_id)) || natural(a.full_name, b.full_name))
    .map(s => [s.full_name, className(s.class_id), CODES[String(s.id)] || "", LINK]));
  const text = "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  a.download = name.replace(/[\\/:*?"<>|]/g, "") + ".csv"; document.body.appendChild(a); a.click(); a.remove();
}

function printCards(list){
  const withCode = (list || []).filter(s => CODES[String(s.id)]).sort((a, b) => natural(className(a.class_id), className(b.class_id)) || natural(a.full_name, b.full_name));
  if (!withCode.length) return toast("Create codes first.");
  document.getElementById("cards").innerHTML = withCode.map(s => `<div class="kcard">
      <div style="display:flex;align-items:center;gap:3mm">${BIRD.replace('width="64"', 'width="44"')}<div><div class="t">Nestlings</div><small>Think, try, learn to fly.</small></div></div>
      <div class="n">${esc(s.full_name)}</div><small>${esc(className(s.class_id))} · ${esc(S.name)}</small>
      <div class="c">${esc(CODES[String(s.id)])}</div>
      <small>Go to <b>${LINK}</b>, type this code and tap <b>Hop in, let’s begin!</b></small></div>`).join("");
  setTimeout(() => window.print(), 150);
}
</script></body></html>
