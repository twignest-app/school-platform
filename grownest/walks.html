<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4A2C5E"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GrowNest"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=20261108s"><title>Learning walks · GrowNest</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet"><script>(function(){try{if((localStorage.getItem("gn_lang")||"en")==="ar"){document.documentElement.lang="ar";document.documentElement.dir="rtl";}}catch(e){}})();</script><script src="i18n-app.js?v=20261108s"></script><link rel="stylesheet" href="rtl-app.css?v=20261108s"></head><body>
<header class="top"><div class="wrap"><a href="index.html"><img src="logo-header.png" alt="GrowNest"></a><a class="btn ghost small" href="app.html">Dashboard</a></div></header>
<main class="wrap" style="padding:28px 20px 60px">
 <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
  <div><h1 style="margin:0">Learning walks</h1><p class="muted" id="sub">Loading…</p></div>
  <button class="btn primary" id="newBtn">New learning walk</button>
 </div>
 <div id="msg" class="msg hide" role="status"></div>
 <section id="newPanel" class="card hide" style="margin:16px 0">
  <h2>New learning walk</h2>
  <div class="det" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px">
   <label class="f">Date<input id="wDate" type="date"></label>
   <label class="f">Title or focus<input id="wTitle" placeholder="e.g. Questioning in Grade 3"></label>
  </div>
  <p style="font-weight:600;margin:6px 0">Choose 2–4 MOE indicators to focus on</p>
  <div id="indPick" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px"></div>
  <div style="display:flex;gap:10px;margin-top:14px"><button class="btn primary" id="createBtn">Start the walk</button><button class="btn ghost" id="cancelBtn" type="button">Cancel</button></div>
 </section>
 <div class="card" style="padding:6px 18px;margin-top:16px"><div id="list"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="gn.js?v=20261108s"></script>
<script>
let ctx=null,inds=[];
async function init(){ctx=await requireStaff();if(!ctx)return;headerButtons([["app.html","Dashboard"],["teachers.html","Teachers"]]);
 const [w,i]=await Promise.all([sb.from("walks").select("*, observations(id,status,teacher_response)").eq("school_id",ctx.school.id).order("walked_on",{ascending:false}),
  sb.from("indicators").select("code,title,moe_ref").contains("used_in",["learning_walk"]).order("sort")]);
 if(w.error)return showMsg($("msg"),friendly(w.error),"err");inds=i.data||[];
 $("indPick").innerHTML=inds.map(x=>`<label class="ck" style="display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer"><input type="checkbox" value="${x.code}" style="width:20px;height:20px;accent-color:var(--plum)"><span><b>${esc(x.code)}</b> ${esc(x.title)}</span></label>`).join("");
 $("sub").textContent=ctx.school.name+" · "+w.data.length+" walk"+(w.data.length===1?"":"s");
 $("list").innerHTML=w.data.length?w.data.map(x=>`<a href="walk.html?id=${x.id}" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit"><div style="flex:1;min-width:220px"><b>${esc(x.title||"Learning walk")}</b><br><span class="muted">${esc(fmtDate(x.walked_on))} · ${x.observations.length} class visit${x.observations.length===1?"":"s"} · focus ${esc(x.indicator_codes.join(", "))}</span></div><span class="lchip">${x.observations.filter(o=>o.status==="sent").length} sent</span></a>`).join(""):`<p class="muted" style="padding:16px 0">No learning walks yet. Tap “New learning walk” to start.</p>`;}
$("newBtn").onclick=()=>{$("newPanel").classList.remove("hide");$("wDate").value=new Date().toISOString().slice(0,10);};
$("cancelBtn").onclick=()=>$("newPanel").classList.add("hide");
$("createBtn").onclick=async()=>{const codes=[...document.querySelectorAll("#indPick input:checked")].map(i=>i.value);
 if(!codes.length)return showMsg($("msg"),"Please choose at least one indicator to focus on.","err");
 if(codes.length>6)return showMsg($("msg"),"Please choose no more than 6 indicators so the walk stays focused.","err");
 const {data,error}=await sb.from("walks").insert({school_id:ctx.school.id,observer_id:ctx.user.id,walked_on:$("wDate").value,academic_year:academicYear($("wDate").value),title:$("wTitle").value.trim()||null,indicator_codes:codes}).select().single();
 if(error)return showMsg($("msg"),friendly(error),"err");location.href="walk.html?id="+data.id;};
init();</script>
</body></html>
