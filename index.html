<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nestopia · One Nest. Infinite Possibilities.</title>
<meta name="description" content="Nestopia brings teaching, learning, leadership and school management together in one connected platform: GrowNest, TwigNest and School Hub.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 110'%3E%3Cpath d='M40 20C56 2 86 8 90 36c3 18 14 30 22 42-16 7-38 12-56 8C34 82 23 62 27 44c2-10 6-18 13-24z' fill='%237BB3E6'/%3E%3Cpath d='M29 33 12 29l15 11z' fill='%23F2B544'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#33405A;--navy-deep:#2A3550;--ink:#2B3550;--muted:#66708A;--line:#E3E8F1;
  --blue:#6AA9E0;--blue-2:#4E86B8;--blue-soft:#E8F2FB;--bird:#7BB3E6;
  --green:#3C9A6E;--green-soft:#E6F5EC;--lav:#7C6BC4;--lav-soft:#EFEBFB;
  --amber:#C47A1C;--amber-soft:#FBF0DC;--rose:#C2513F;--rose-soft:#F9E5E1;
  --bg:#F7F9FD;--card:#FFFFFF;--shadow:0 18px 50px -24px rgba(42,53,80,.28);
  color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#C9D6EE;--navy-deep:#E3EAF7;--ink:#E8EDF7;--muted:#A3ADC4;--line:#2E3850;
  --blue:#8DBDEB;--blue-2:#8DBDEB;--blue-soft:#1C2A3E;--bird:#7BB3E6;
  --green:#7FCBA4;--green-soft:#173126;--lav:#B7A9F0;--lav-soft:#262243;
  --amber:#E6B566;--amber-soft:#3A2E17;--rose:#E8897C;--rose-soft:#3D2220;
  --bg:#121725;--card:#1A2133;--shadow:0 18px 50px -24px rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(84px + env(safe-area-inset-top,0px))}
body{font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px}
a{color:var(--blue-2)}
h1,h2,h3{margin:0;line-height:1.15}
.serif{font-family:"Playfair Display",Georgia,serif;font-weight:800;letter-spacing:-.02em}
.wrap{max-width:1140px;margin:0 auto;padding:0 clamp(18px,4vw,32px)}
.eyebrow{color:var(--blue-2);letter-spacing:.2em;font-size:13.5px;font-weight:500;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;font-weight:700;font-size:15.5px;cursor:pointer;text-decoration:none;background:var(--navy);color:#fff;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn.light{background:var(--card);color:var(--navy);border:1.5px solid var(--line)}
.btn.small{padding:8px 16px;font-size:14px}
.btn.text{background:none;color:var(--navy);padding:8px 12px}
.btn:disabled{opacity:.55;cursor:wait}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.light):not(.text){color:#121725}}
.note{color:var(--muted);font-size:14.5px}
.msg{border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:700;font-size:14px}
.msg.err{background:var(--rose-soft);color:var(--rose)}.msg.ok{background:var(--green-soft);color:var(--green)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 26px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 5px}
input[type=text],input[type=email],input[type=password],input[type=tel],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 13px}
textarea{min-height:90px;resize:vertical}
.full{width:100%;margin-top:18px;justify-content:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* ---------- landing ---------- */
.site-top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.site-top .wrap{display:flex;align-items:center;gap:20px;height:78px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy)}
.logo svg{width:52px;height:46px;flex:none}
.logo b{display:block;font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1}
.logo b i{font-style:normal;color:var(--blue)}
.logo small{display:block;font-size:12.5px;letter-spacing:.18em;color:var(--muted);margin-top:4px}
.nav{display:flex;gap:26px;margin-left:auto}
.nav a{color:var(--ink);text-decoration:none;font-size:15.5px;opacity:.85}
.nav a:hover{opacity:1;color:var(--blue-2)}
.top-acts{display:flex;gap:6px;align-items:center;margin-left:18px}
.menu-btn{display:none;margin-left:auto;background:none;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:700}
@media (max-width:980px){.nav{display:none}.menu-btn{display:block}.top-acts{margin-left:8px}
  .site-top.open .nav{display:flex;flex-direction:column;position:absolute;top:78px;left:0;right:0;background:var(--card);padding:16px clamp(18px,4vw,32px) 22px;gap:14px;border-bottom:1px solid var(--line)}}
@media (max-width:560px){.top-acts .btn:not(.text){display:none}.logo small{display:none}}

.hero{position:relative;overflow:hidden;background:radial-gradient(60% 70% at 85% 10%,var(--blue-soft),transparent 70%),radial-gradient(40% 50% at 10% 80%,var(--lav-soft),transparent 70%)}
.hero .wrap{display:grid;grid-template-columns:1fr 1.02fr;gap:clamp(24px,4vw,56px);align-items:center;padding-top:clamp(40px,6vw,72px);padding-bottom:clamp(60px,8vw,96px)}
.hero h1{font-size:clamp(52px,7.6vw,92px);line-height:.98;color:var(--navy)}
.hero h1 span{display:block}
.hero h1 .glow{background:linear-gradient(100deg,#5A9FDB,#9CCAF0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:clamp(17px,1.6vw,19.5px);color:var(--muted);max-width:30em;margin:26px 0 30px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap}
.hero .join{margin-top:18px;font-size:14.5px;color:var(--muted)}
.hero .join button{background:none;border:0;padding:0;color:var(--blue-2);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}}

/* hero mock dashboard */
.stage{position:relative;max-width:560px;margin:0 auto;width:100%}
.stage .ring{position:absolute;inset:-6% -2% -8% 4%;border:1.5px dashed color-mix(in srgb,var(--blue) 45%,transparent);border-radius:50%}
.mock{position:relative;background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line);display:grid;grid-template-columns:96px 1fr;margin:58px 0 0 28px;overflow:hidden}
.mock .side{background:color-mix(in srgb,var(--bg) 70%,var(--card));padding:70px 16px 16px;display:flex;flex-direction:column;gap:12px}
.mock .side i{display:block;height:7px;border-radius:9px;background:var(--line)}
.mock .side i:nth-child(1){width:90%}.mock .side i:nth-child(2){width:70%}.mock .side i:nth-child(3){width:80%}.mock .side i:nth-child(4){width:55%}
.mock .body{padding:26px 22px 18px}
.mock .hi{font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.mock h3{font-size:20px;color:var(--navy);margin:6px 0 16px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--bg);border-radius:14px;padding:11px 12px}
.stat small{display:block;font-size:10.5px;color:var(--muted)}
.stat b{font-size:20px;color:var(--navy)}
.chart{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px 12px 6px}
.chart small{font-size:10.5px;font-weight:700;color:var(--navy)}
.chart svg{width:100%;height:auto;display:block}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chips span{font-size:10.5px;padding:4px 10px;border-radius:999px}
.float{position:absolute;background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:12px 16px;font-size:13.5px;font-weight:700;color:var(--navy)}
.float small{display:block;font-size:9.5px;letter-spacing:.08em;color:var(--muted);font-weight:500;margin-bottom:3px}
.f1{top:20px;right:-6px}.f2{bottom:28px;left:0}.f3{bottom:8px;right:-4px}
.stage .bird{position:absolute;top:0;left:0;width:132px;height:124px;filter:drop-shadow(0 10px 12px rgba(42,53,80,.15))}
.stage .perch{position:absolute;top:116px;left:30px;width:90px;height:6px;border-radius:6px;background:var(--bird)}
.stage .note{position:absolute;top:6px;left:146px;color:var(--navy);font-size:20px}
@media (max-width:560px){.mock{grid-template-columns:1fr;margin-left:0;margin-top:96px}.mock .side{display:none}.f1{right:0;top:6px}.f3{display:none}.stage .bird{width:100px}.stage .perch{display:none}}

/* sections */
section.band{padding:clamp(64px,9vw,110px) 0}
.sec-head h2{font-size:clamp(30px,3.6vw,44px);color:var(--navy)}
.sec-head p{color:var(--muted);font-size:17px;max-width:38em;margin:16px 0 0}
.sec-head.center{text-align:center}.sec-head.center p{margin-left:auto;margin-right:auto}

.nests{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px}
.nest{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.nest .top{padding:24px 24px 20px;position:relative;overflow:hidden}
.nest.g .top{background:linear-gradient(160deg,var(--green-soft),transparent 85%)}
.nest.t .top{background:linear-gradient(160deg,var(--lav-soft),transparent 85%)}
.nest.h .top{background:linear-gradient(160deg,var(--blue-soft),transparent 85%)}
.nest .top::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--card) 70%,transparent)}
.ico{width:44px;height:44px;border-radius:14px;background:var(--card);display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(42,53,80,.25)}
.ico svg{width:22px;height:22px}
.nest .kind{letter-spacing:.2em;font-size:12.5px;color:var(--muted);margin:18px 0 6px}
.nest h3{font-size:24px;color:var(--navy)}
.nest .tag{font-weight:700;color:var(--ink);margin:6px 0 18px;font-size:15.5px}
.mini{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;font-size:12px;position:relative;z-index:1}
.mini b{font-size:12px;color:var(--navy)}
.mini .bar{height:7px;border-radius:9px;margin-top:8px;background:var(--line);position:relative;overflow:hidden}
.mini .bar i{position:absolute;inset:0 auto 0 0;border-radius:9px}
.mini .cap{font-size:10.5px;color:var(--muted);margin-top:10px}
.mini .cols{display:flex;align-items:flex-end;gap:7px;height:56px;margin-top:10px}
.mini .cols i{flex:1;border-radius:6px 6px 3px 3px;background:var(--lav);opacity:.85}
.mini .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.mini .trio div{border-radius:10px;padding:6px 8px;background:var(--bg)}
.mini .trio small{display:block;font-size:9.5px;color:var(--muted)}
.mini .trio b{font-size:15px}
.nest .txt{padding:6px 24px 24px;display:flex;flex-direction:column;flex:1}
.nest .txt p{color:var(--muted);font-size:15px;margin:0 0 20px;flex:1}
.nest .txt a{font-weight:700;color:var(--navy);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.nest .txt a:hover{color:var(--blue-2)}
.nest.g .top.brand{background:#F7F4FB}.nest.t .top.brand{background:#FFF9F9}
.nest .top.brand::after{display:none}
.nest .top.brand .kind{color:#6B5A86}.nest.t .top.brand .kind{color:#7A6A8F}
.nest .top.brand .tag{color:#3A2350}
.nest .brandlogo{display:block;height:46px;width:auto;margin:2px 0 4px}
.hubviz{position:relative;aspect-ratio:4/3;border-radius:18px;background:linear-gradient(135deg,#EAF3FC,#F6F3F8 55%,#FBEDE2);border:1px solid #E1E9F3;box-shadow:var(--shadow);overflow:hidden;color:#2A3550}
.hubviz .orbits{position:absolute;inset:4% 2%;width:96%;height:92%}
.hubviz .sat{position:absolute;transform:translate(-50%,-50%);background:#fff;border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:700;box-shadow:0 4px 12px -6px rgba(42,53,80,.35);white-space:nowrap;z-index:1}
.hubcard{position:absolute;left:50%;top:52%;width:56%;transform:translate(-50%,-48%) rotate(-3deg);background:#fff;border-radius:14px;padding:10px 10px 12px;box-shadow:0 18px 30px -16px rgba(42,53,80,.45);z-index:2}
.hc-head{display:flex;justify-content:space-between;gap:6px;font-size:9.5px;letter-spacing:.04em;margin-bottom:8px}
.hc-head em{font-style:normal;color:#4E86B8;font-weight:700}
.hc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.hc-grid div{border-radius:7px;padding:4px 6px;font-size:11px;font-weight:700}
.hc-grid small{display:block;font-size:9px;font-weight:500;color:#5D6782}
.hubbird{position:absolute;right:9%;top:20%;width:15%;height:auto;z-index:3;filter:drop-shadow(0 6px 6px rgba(42,53,80,.18))}.nest .shot{display:block;
width:100%;height:auto;border-radius:16px;margin-top:4px}
@media (max-width:900px){.nests{grid-template-columns:1fr}}

.connect{background:radial-gradient(45% 55% at 50% 55%,var(--blue-soft),transparent 75%)}
.web{position:relative;max-width:860px;margin:50px auto 0;aspect-ratio:860/470}
.web svg.lines{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:23%;min-width:120px;border-radius:22px;padding:18px 10px;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow)}
.node b{display:block;color:var(--navy);font-size:16px;margin-top:6px}
.node small{color:var(--muted);font-size:12px}
.node svg{width:22px;height:22px}
.node.g{left:12%;top:16%;background:var(--green-soft)}.node.t{left:88%;top:16%;background:var(--lav-soft)}.node.h{left:50%;top:84%;background:var(--blue-soft)}
.core{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:28%;aspect-ratio:1.25;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;text-align:center;align-content:center}
.core svg{width:38%;height:auto}
.core b{display:block;color:var(--navy);font-size:19px}
.core small{color:var(--muted);font-size:12px}
@media (max-width:640px){.web{aspect-ratio:auto;display:grid;gap:12px;justify-items:center}.web svg.lines{display:none}.node,.core{position:static;transform:none;width:100%;max-width:300px}.core{aspect-ratio:auto;border-radius:24px;padding:18px;order:-1}.core svg{width:70px}}

.inside{background:color-mix(in srgb,var(--blue-soft) 45%,var(--bg))}
.inside .sec-head .demo{font-size:14.5px;margin-top:8px}
.app{margin:42px auto 0;max-width:1010px;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 40px 80px -40px rgba(42,53,80,.35);overflow:hidden}
.app .chrome{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.app .chrome i{width:8px;height:8px;border-radius:50%;display:inline-block}
.app .chrome .demo-tag{margin-left:auto;letter-spacing:0;background:var(--blue-soft);color:var(--navy);padding:4px 12px;border-radius:999px}
.app .grid{display:grid;grid-template-columns:190px 1fr}
.app nav{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--bg) 60%,var(--card))}
.app nav span{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.app nav span.on{background:var(--blue-soft);color:var(--navy)}
.app nav svg{width:15px;height:15px}
.app .main{padding:22px;background:color-mix(in srgb,var(--bg) 50%,var(--card))}
.app .welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.app .welcome small{font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.app .welcome h3{font-size:20px;color:var(--navy);margin-top:4px}
.app .welcome em{font-style:normal;font-size:11.5px;background:var(--green-soft);color:var(--green);padding:5px 12px;border-radius:999px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi small{display:block;font-size:11.5px;color:var(--muted)}
.kpi b{display:block;font-size:22px;color:var(--navy);margin:6px 0 4px}
.kpi em{font-style:normal;font-size:11px;font-weight:700}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;margin-top:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h4{margin:0 0 8px;font-size:14px;color:var(--navy);display:flex;justify-content:space-between}
.box h4 small{font-weight:400;color:var(--muted);font-size:11px}
.box p{margin:6px 0;font-size:12px;color:var(--muted)}
.box ul{list-style:none;padding:0;margin:0}
.box li{font-size:12px;color:var(--ink);padding:7px 0;border-bottom:1px solid var(--line)}
.box li:last-child{border:0}
.box svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:11px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
@media (max-width:800px){.app .grid{grid-template-columns:1fr}.app nav{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}

.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:42px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.feat .ico{background:var(--bg);box-shadow:none}
.feat h3{font-size:18px;color:var(--navy);margin:16px 0 6px;font-family:"DM Sans",sans-serif;font-weight:700}
.feat p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:900px){.feats{grid-template-columns:1fr 1fr}}@media (max-width:560px){.feats{grid-template-columns:1fr}}

.family .tree{display:flex;flex-direction:column;align-items:center;margin-top:40px}
.leafbox{border-radius:16px;padding:14px 24px;font-weight:700;border:1px solid var(--line);box-shadow:var(--shadow);display:inline-flex;gap:8px;align-items:center;color:var(--navy);min-width:170px;justify-content:center;text-decoration:none}
.leafbox svg{width:22px;height:20px}
.leafbox.root{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .leafbox.root{color:#121725}}
.leafbox.mid{background:var(--blue-soft)}
.stem{width:2px;height:28px;background:var(--blue);opacity:.6;margin:8px 0}
.kids{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.kids .g{background:var(--green-soft)}.kids .t{background:var(--lav-soft)}.kids .h{background:var(--blue-soft)}

.cta{position:relative;overflow:hidden;background:linear-gradient(120deg,#8CC4EE,#B9DCF5 60%,#DCEEFB);text-align:center;padding:clamp(70px,9vw,110px) 0;color:#2A3550}
.cta::before,.cta::after{content:"";position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.6)}
.cta::before{width:420px;height:420px;right:-120px;top:-260px}.cta::after{width:300px;height:300px;left:-140px;bottom:-200px}
.cta .eyebrow{color:#2A3550;opacity:.8}
.cta h2{font-size:clamp(28px,3.4vw,40px);color:#2A3550}
.cta p{margin:16px 0 30px;font-size:17px}

/* ---------- movement (switched off automatically when a device asks for reduced motion) ---------- */
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -9px}}
@keyframes bobSmall{0%,100%{translate:0 0}50%{translate:0 -5px}}
@keyframes spin{to{rotate:360deg}}
@keyframes dash{to{stroke-dashoffset:-60}}
@keyframes dashRev{to{stroke-dashoffset:60}}
@keyframes draw{from{stroke-dashoffset:var(--len,900)}to{stroke-dashoffset:0}}
@keyframes twinkle{0%,100%{opacity:1;scale:1}50%{opacity:.35;scale:.7}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
@keyframes noteUp{0%,100%{translate:0 0;opacity:.9}50%{translate:0 -6px;opacity:.5}}
.stage .bird{animation:bob 4s ease-in-out infinite}
.stage .note{animation:noteUp 3s ease-in-out infinite}
.stage .ring{animation:spin 80s linear infinite}
.float{animation:bobSmall 5s ease-in-out infinite}.f2{animation-delay:-1.6s}.f3{animation-delay:-3.2s}
path.draw{stroke-dasharray:var(--len,900);animation:draw 2.4s ease-out both}
path.draw.d2{animation-delay:.4s}
.flowline{animation:dash 3s linear infinite}.flowline.rev{animation-name:dashRev;animation-duration:5s}
.core svg{animation:bob 4.5s ease-in-out infinite}
.node{animation:bobSmall 6s ease-in-out infinite}.node.t{animation-delay:-2s}.node.h{animation-delay:-4s}
.hubviz .sat{animation:bobSmall 4.5s ease-in-out infinite}
.hubbird{animation:bob 3.8s ease-in-out infinite}
.hubcard{animation:bobSmall 6s ease-in-out infinite}

.cta .flow{animation:dash 4s linear infinite}

.pulse{animation:pulse 4s ease-in-out infinite}

<script>
document.documentElement.classList.add("js");
const PLATFORM = "Nestopia";
const SUPABASE_URL = "https://gvhzbxpgebgjnegdiijp.supabase.co";
const SUPABASE_KEY = "sb_publishable_aEQ4MVt00kNu8PaVtrNnqQ_9guhxPYM";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* The parts of Nestopia. "url" is set once a part is ready to open. */
const MODULES = [
  { id: "twignest",  name: "TwigNest",       tint: "var(--lav-soft)",   icon: "i-chart",  colour: "var(--lav)",    desc: "Attainment, assessment and progress across grades and subjects, with next steps and report comments.", url: "twignest/" },
  { id: "grownest",  name: "GrowNest",       tint: "var(--green-soft)", icon: "i-sprout", colour: "var(--green)",  desc: "Learning walks, observations and appraisals, with feedback emailed to teachers.", url: "grownest/app.html" },
  { id: "planning",  name: "Planning",       tint: "var(--blue-soft)",  icon: "i-book",   colour: "var(--blue-2)", desc: "The curriculum coverage map: what each grade has taught and assessed.", url: "planning.html" },
  { id: "inclusion", name: "Inclusion",      tint: "var(--blue-soft)",  icon: "i-heart",  colour: "var(--rose)",   desc: "The inclusion register and support plans: students of determination, gifted and talented and EAL, with targets and reviews.", url: "inclusion.html" },
  { id: "wellbeing", name: "Wellbeing",      tint: "var(--blue-soft)",  icon: "i-spark",  colour: "var(--amber)",  desc: "Short daily check-ins, so the right adult hears when a student needs to talk.", url: "wellbeing.html" },
  { id: "evidence",  name: "Evidence packs", tint: "var(--blue-soft)",  icon: "i-file",   colour: "var(--muted)",  desc: "Inspection evidence for each framework standard, ready to share as PowerPoint or Word.", url: "evidence.html" }
];
const ROLES = { admin: "Admin", school_lead: "School leader", coordinator: "Coordinator", teacher: "Teacher", checker: "Buddy checker" };

const root = document.getElementById("root");
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const here = location.origin + location.pathname;
let authTab = "landing", recovering = false, adminTab = "schools", app, right;

function friendly(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login/i.test(m)) return "The email or password is not correct.";
  if (/Email not confirmed/i.test(m)) return "Please confirm your email first. Check your inbox for the confirmation link.";
  if (/already registered/i.test(m)) return "An account with this email already exists. Try signing in instead.";
  if (/Password should be/i.test(m)) return "The password needs at least 8 characters.";
  if (/rate limit/i.test(m)) return "Too many attempts. Please wait a few minutes and try again.";
  return m;
}
function show(el, text, kind){ el.innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : ""; }
async function busy(btn, fn){ btn.disabled = true; try { await fn(); } finally { btn.disabled = false; } }
const initials = n => String(n || "?").split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const logoHtml = `<a class="logo" href="./" id="homeLink"><svg aria-hidden="true"><use href="#bird"/></svg><span><b>Nest<i>op</i>ia</b><small>POWERED BY THINKNEST</small></span></a>`;

/* ---------- Landing page ---------- */
function landingView(){
  document.title = "Nestopia · One Nest. Infinite Possibilities.";
  root.innerHTML = ""; root.appendChild(document.getElementById("landing").content.cloneNode(true));
  root.querySelectorAll("[data-auth]").forEach(b => b.addEventListener("click", e => { e.preventDefault(); authTab = b.dataset.auth; authView(); window.scrollTo(0, 0); }));
  const top = document.getElementById("siteTop"), mb = document.getElementById("menuBtn");
  mb.onclick = () => { const o = top.classList.toggle("open"); mb.setAttribute("aria-expanded", String(o)); };
  top.querySelectorAll(".nav a").forEach(a => a.addEventListener("click", () => { top.classList.remove("open"); mb.setAttribute("aria-expanded", "false"); }));
  /* the gentle reveal as sections come into view */
  const els = root.querySelectorAll(".reveal");
  if ("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: 0, rootMargin: "0px 0px -8% 0px" });
    els.forEach(el => io.observe(el));
    setTimeout(() => els.forEach(el => el.classList.add("in")), 2500);
  } else els.forEach(el => el.classList.add("in"));
  /* request a demo */
  const dlg = document.getElementById("demoDlg"), f = document.getElementById("demoForm"), msg = document.getElementById("demoMsg");
  root.querySelectorAll("[data-demo]").forEach(b => b.addEventListener("click", e => { e.preventDefault(); show(msg, ""); f.hidden = false; dlg.showModal(); }));
  document.getElementById("demoClose").onclick = () => dlg.close();
  f.onsubmit = e => { e.preventDefault(); const btn = document.getElementById("demoBtn");
    busy(btn, async () => {
      const v = id => document.getElementById(id).value.trim();
      const { error } = await sb.rpc("submit_demo_request", { p_full_name: v("d_name"), p_role: v("d_role"), p_school: v("d_school"), p_emirate: v("d_emirate"), p_email: v("d_email"), p_phone: v("d_phone"), p_message: v("d_msg") });
      if (error) return show(msg, "Your request couldn’t be sent: " + friendly(error), "err");
      f.reset(); show(msg, "Thank you. Your request has been sent, and we’ll be in touch soon.", "ok");
    }); };
  const yr = document.getElementById("yr"); if (yr) yr.textContent = new Date().getFullYear();
  if (location.hash && location.hash.length > 1) { const t = document.getElementById(location.hash.slice(1)); if (t) setTimeout(() => t.scrollIntoView(), 50); }
}

/* ---------- App shell (sign-in pages and signed-in pages) ---------- */
function shell(){
  document.title = PLATFORM;
  root.innerHTML = `<header class="bar">${logoHtml}<div class="right" id="right"></div></header><main class="appmain" id="app"></main>`;
  app = document.getElementById("app"); right = document.getElementById("right");
  document.getElementById("homeLink").onclick = e => { e.preventDefault(); authTab = "landing"; render(); };
}

function authView(){
  if (authTab === "landing") return landingView();
  shell();
  right.innerHTML = `<button class="btn text" type="button" id="backHome">Back to the home page</button>`;
  document.getElementById("backHome").onclick = () => { authTab = "landing"; landingView(); window.scrollTo(0, 0); };
  app.innerHTML = `<div class="narrow">
    <div class="panel">
      ${authTab !== "forgot" ? `<div class="tabs" role="group" aria-label="Account">
        <button data-tab="signin" aria-pressed="${authTab === "signin"}">Sign in</button>
        <button data-tab="signup" aria-pressed="${authTab === "signup"}">Create account</button></div>` : `<h2 class="serif" style="font-size:28px;color:var(--navy)">Reset your password</h2>`}
      <form id="authForm">
        ${authTab === "signup" ? `<label for="name">Full name</label><input id="name" type="text" autocomplete="name" required>` : ""}
        <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>

      </form>
      ${authTab === "signin" ? `<p class="note" style="margin:14px 0 0"><button class="link" data-tab="forgot">Forgot your password?</button></p>` : ""}
      ${authTab === "forgot" ? `<p class="note" style="margin:14px 0 0"><button class="link" data-tab="signin">Back to sign in</button></p>` : ""}
      ${authTab === "signup" ? `<p class="note" style="margin:14px 0 0">After creating your account, you can register your school or join it with your school’s code.</p>` : ""}
      <div id="authMsg"></div>
    </div></div>`;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { authTab = b.dataset.tab; authView(); });
  document.getElementById("authForm").onsubmit = e => { e.preventDefault();
    const btn = document.getElementById("authBtn"), msg = document.getElementById("authMsg");
    busy(btn, async () => {
      const email = document.getElementById("email").value.trim();
      if (authTab === "signin") {
        const { error } = await sb.auth.signInWithPassword({ email, password: document.getElementById("pw").value });
        if (error) return show(msg, friendly(error), "err");
      } else if (authTab === "signup") {
        const { error } = await sb.auth.signUp({ email, password: document.getElementById("pw").value,
          options: { data: { full_name: document.getElementById("name").value.trim() }, emailRedirectTo: here } });

        show(msg, "Account created. Check your email and tap the confirmation link, then sign in here.", "ok");

        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: here });
        if (error) return show(msg, friendly(error), "err");
        show(msg, "If this email has an account, a reset link is on its way.", "ok");
      }
    }); };
}

async function overviewData(p, school, lead){
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  try { const { count } = await sb.from("students").select("id", { count: "exact", head: true }).eq("school_id", school.id).eq("archived", false); set("ovStu", (count || 0).toLocaleString("en-GB")); } catch (_) {}
  // Attendance today
  try {
    const d = new Date(), t = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const { data, error } = await sb.from("attendance_marks").select("status").eq("school_id", school.id).eq("day", t);
    if (!error) { const n = (data || []).length, a = (data || []).filter(m => m.status === "present" || m.status === "late").length;
      set("ovAtt", n ? Math.round(a / n * 100) + "%" : "–"); set("ovAtts", n ? `${a} of ${n} marked in school` : "No registers yet today"); const el = document.getElementById("ovAtts"); if (el) el.className = n ? "green" : "muted"; }
  } catch (_) {}
  // GrowNest observations this academic year (if this account can see them)
  try {
    const now = new Date(), y0 = now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear() - 1;
    let q = sb.from("observations").select("id", { count: "exact", head: true }).gte("observed_on", y0 + "-08-01");
    const { count, error } = await q; if (!error) set("ovObs", count || 0); else set("ovObss", "Open GrowNest");
  } catch (_) {}
  // Coming up: inclusion observations and meetings, and plan reviews
  try {
    const t = new Date().toISOString(), soon = new Date(Date.now() + 21 * 864e5).toISOString();
    const [ev, pl] = await Promise.all([
      sb.from("inclusion_events").select("kind,starts_at,status").eq("school_id", school.id).gte("starts_at", t).lte("starts_at", soon).neq("status", "cancelled").order("starts_at").limit(5),
      lead ? sb.from("inclusion_plans").select("review_date").eq("school_id", school.id).eq("status", "active").gte("review_date", t.slice(0, 10)).lte("review_date", soon.slice(0, 10)).order("review_date").limit(5) : Promise.resolve({ data: [] })]);
    const se = await sb.from("school_events").select("title,start_date,start_time,category").eq("school_id", school.id).gte("end_date", t.slice(0, 10)).lte("start_date", soon.slice(0, 10)).order("start_date").limit(6);
    const rows = [...(se.data || []).map(e => [e.start_date + "T" + (e.start_time || "08:00"), e.title, "calendar.html"]), ...(ev.data || []).map(e => [e.starts_at, (e.kind === "parent_meeting" ? "Parent meeting" : "Inclusion observation") + (e.status === "proposed" ? " (to confirm)" : ""), "inclusion.html"]),
      ...(pl.data || []).map(x => [x.review_date + "T08:00:00", "Support plan review", "inclusion.html#reviews"])].sort((a, b) => a[0].localeCompare(b[0])).slice(0, 6);
    const box = document.getElementById("ovEvents");
    if (box) box.innerHTML = rows.length ? rows.map(r => `<a class="ovev" href="${r[2]}"><span class="ovdate"><b>${new Date(r[0]).getDate()}</b>${new Date(r[0]).toLocaleDateString("en-GB", { month: "short" })}</span><span>${esc(r[1])}<br><small class="note">${new Date(r[0]).toLocaleDateString("en-GB", { weekday: "long" })}</small></span></a>`).join("")
      : '<p class="note" style="margin:0">Nothing in the next three weeks. <a href="calendar.html">Open the calendar</a></p>';
  } catch (_) { const box = document.getElementById("ovEvents"); if (box) box.innerHTML = '<p class="note" style="margin:0">Nothing coming up.</p>'; }
  // Student progress from TwigNest, term by term
  const ch = document.getElementById("ovChart");
  try {
    if (typeof twigSchoolSummary !== "function") throw new Error("x");
    const S = await twigSchoolSummary(sb, school.id);
    const pts = S ? S.terms.filter(t => t.attainment != null || t.progress != null) : [];
    if (!pts.length) { ch.innerHTML = '<p class="note">Progress appears here once TwigNest has results for at least one term.</p>'; return; }
    const W = 640, H = 220, pad = 34, xs = k => pts.length === 1 ? W / 2 : pad + k * (W - pad * 2) / (pts.length - 1), ys = v => H - pad - (v / 100) * (H - pad * 2);
    const line = (key, col) => { const ok = pts.map((t, k) => [k, t[key]]).filter(x => x[1] != null); if (!ok.length) return "";
      const d = ok.map(([k, v], i) => (i ? "L" : "M") + xs(k).toFixed(1) + " " + ys(v).toFixed(1)).join(" ");
      return `<path d="${d}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>` + ok.map(([k, v]) => `<circle cx="${xs(k)}" cy="${ys(v)}" r="5" fill="${col}"><title>${v}%</title></circle><text x="${xs(k)}" y="${ys(v) - 11}" text-anchor="middle" font-size="12" font-weight="700" fill="${col}">${v}%</text>`).join(""); };
    ch.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Student progress by term">
      ${[25, 50, 75].map(v => `<line x1="${pad}" x2="${W - pad}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/>`).join("")}
      ${line("attainment", "#6E9BD8")}${line("progress", "#8BCFA8")}
      ${pts.map((t, k) => `<text x="${xs(k)}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(t.name)}</text>`).join("")}</svg>
      <div class="ovlegend"><span><i style="background:#6E9BD8"></i>In line or above standards</span><span><i style="background:#8BCFA8"></i>Expected progress or better</span></div>`;
  } catch (_) { ch.innerHTML = '<p class="note">Progress appears here once TwigNest is set up for your school.</p>'; }
}

// Wellbeing: students who asked to talk today and haven't been followed up yet
async function wellbeingReminder(p, school){
  try {
    if (!(school.modules || []).includes("wellbeing")) return;
    const d = new Date(), t = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    // new concerns: safeguarding ones are only visible to the safeguarding lead(s), so each person sees only their own count
    try {
      const { data: cs } = await sb.from("wellbeing_concerns").select("safeguarding,urgent").eq("school_id", school.id).eq("status", "new");
      if (cs && cs.length) {
        const sg = cs.filter(c => c.safeguarding).length, other = cs.length - sg, urg = cs.filter(c => c.urgent).length;
        const b2 = document.createElement("div"); b2.className = "panel"; b2.style.cssText = "margin-bottom:16px;border-left:5px solid " + (sg || urg ? "#B4473A" : "#A86C12");
        b2.innerHTML = `<p style="margin:0;font-weight:700">📝 Wellbeing: ${[sg ? `${sg} new safeguarding concern${sg === 1 ? "" : "s"} 🔒` : "", other ? `${other} new concern${other === 1 ? "" : "s"}` : ""].filter(Boolean).join(" and ")}${urg ? ` (${urg} urgent)` : ""}.</p><p style="margin:8px 0 0"><a class="btn" href="wellbeing.html">Open Wellbeing</a></p>`;
        placeNote(b2);
      }
    } catch (_) {}
    const { data, error } = await sb.from("wellbeing_checkins").select("id").eq("school_id", school.id).eq("day", t).eq("talk", true).is("followed_up_at", null);
    if (error || !data || !data.length) return;
    const b = document.createElement("div"); b.className = "panel"; b.style.cssText = "margin-bottom:16px;border-left:5px solid #B4473A";
    b.innerHTML = `<p style="margin:0;font-weight:700">🙋 Wellbeing: ${data.length} student${data.length === 1 ? " has" : "s have"} asked to talk to someone today.</p><p style="margin:8px 0 0"><a class="btn" href="wellbeing.html">See who</a></p>`;
    placeNote(b);
  } catch (_) {}
}

// Inclusion team: plan reviews that are overdue or due in the next 14 days
async function inclusionReminder(p, school){
  try {
    if (!(school.modules || []).includes("inclusion")) return;
    // referral tasks for everyone (teachers, team members, the inclusion head)
    try {
      const head = ["school_lead", "admin"].includes(p.role) || p.inclusion_head;
      const [{ data: rf }, { data: ev }] = await Promise.all([sb.from("inclusion_referrals").select("status,teacher_id,assigned_to").eq("school_id", school.id).not("status", "in", "(closed,declined)"),
        sb.from("inclusion_events").select("status,teacher_id,staff_id,proposed_by").eq("school_id", school.id).in("status", ["proposed", "reschedule"])]);
      let n = 0;
      (rf || []).forEach(r => { if (head && ["submitted", "observed"].includes(r.status)) n++; if (r.assigned_to === p.id && r.status === "assigned") n++; if (r.teacher_id === p.id && r.status === "more_info") n++; });
      (ev || []).forEach(e => { if (e.teacher_id === p.id && e.status === "proposed" && e.proposed_by !== p.id) n++; if (e.staff_id === p.id && e.status === "reschedule") n++; });
      if (n) {
        const b = document.createElement("div"); b.className = "panel"; b.style.cssText = "margin-bottom:16px;border-left:5px solid #A86C12";
        b.innerHTML = `<p style="margin:0;font-weight:700">🙋 Inclusion referrals: ${n} thing${n === 1 ? "" : "s"} waiting for you.</p><p style="margin:8px 0 0"><a class="btn" href="inclusion.html">Open Inclusion</a></p>`;
        placeNote(b);
      }
    } catch (_) {}
    if (!(["school_lead", "coordinator", "admin"].includes(p.role) || p.inclusion_lead || p.inclusion_head)) return;
    const soon = new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10), today = new Date().toISOString().slice(0, 10);
    const { data, error } = await sb.from("inclusion_plans").select("review_date").eq("school_id", school.id).eq("status", "active").lte("review_date", soon);
    if (error || !data || !data.length) return;
    const late = data.filter(x => x.review_date < today).length, due = data.length - late;
    const box = document.createElement("div");
    box.className = "panel"; box.style.cssText = "margin-bottom:16px;border-left:5px solid " + (late ? "#B4473A" : "#A86C12");
    box.innerHTML = `<p style="margin:0;font-weight:700">💜 Inclusion: ${late ? `<span style="color:#B4473A">${late} plan review${late === 1 ? " is" : "s are"} overdue</span>` : ""}${late && due ? " and " : ""}${due ? `${due} ${due === 1 ? "is" : "are"} due in the next 2 weeks` : ""}.</p>
      <p style="margin:8px 0 0"><a class="btn" href="inclusion.html#reviews">See reviews due</a></p>`;
    placeNote(box);
  } catch (_) {}
}

  app.innerHTML = `<div class="phead"><div><h1 class="ptitle serif">Schools</h1><p class="note">Approve schools and choose which parts of Nestopia each one uses.</p></div>

    ${waiting.map(card).join("")}${others.map(card).join("")}`;

  app.querySelectorAll(".school").forEach(art => {
    const sid = art.dataset.sid, note = art.querySelector(".saved");

      if (b.dataset.st === "suspended" && !confirm("Suspend this school? Its staff lose access until you reactivate it.")) return;
      const { error } = await sb.rpc("set_school_status", { p_school: sid, p_status: b.dataset.st });

async function render(){
  if (recovering) return resetView();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return authView();
  shell();
  const { data: p, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !p) { app.innerHTML = `<div class="narrow panel"><div class="msg err">Your account couldn’t be loaded. Sign out and sign in again.</div>
    <button class="btn light full" id="out2">Sign out</button></div>`; document.getElementById("out2").onclick = async () => { await sb.auth.signOut(); render(); }; return; }
  topBar(p);
  if (p.platform_admin && (!p.school_id || adminTab === "schools")) return adminView();
  if (!p.school_id) return chooseView(p);
  const { data: school } = await sb.from("schools").select("*").eq("id", p.school_id).single();
  if (!school) return waitView("Almost there", "Your school couldn’t be found. Please get in touch with us.");
  if (school.status === "pending") return waitView(`${school.name} is waiting for approval`, "We’ll check your school soon. You can set it up as soon as it’s approved.");
  if (school.status === "suspended") return waitView("Access paused", `${school.name}’s access is paused. Please get in touch with us.`);
  if (!p.active) return waitView("Waiting for your school leader", `You’ve joined ${school.name}. Your school leader needs to approve your account before you can start.`);
  homeView(p, school);
}

sb.auth.onAuthStateChange(event => {
  if (event === "PASSWORD_RECOVERY") { recovering = true; resetView(); return; }
  if (event === "SIGNED_IN" || event === "SIGNED_OUT") setTimeout(render, 0);
});
render();
</script>
</body>
</html>
