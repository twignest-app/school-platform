<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#462D5B;--plum-deep:#2F1C3F;--plum-2:#6A4B85;--plum-soft:#EEE7F5;
  --sage:#5E8455;--sage-soft:#E5EEE1;--leaf:#9DBE8E;
  --honey:#B9821D;--honey-soft:#FAF0DA;--rose:#B4473A;--rose-soft:#F8E4E1;
  --sky:#5F7FC4;--sky-soft:#E6ECF8;
  --bg:#F5F1F8;--card:#FFFFFF;--ink:#2B1F38;--muted:#6E6480;--line:#E3DBEC;
  color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --plum:#CDB9EA;--plum-deep:#E9DEF7;--plum-2:#DCCCF2;--plum-soft:#33293F;
  --sage:#A7C59A;--sage-soft:#25321F;--leaf:#6E8E61;
  --honey:#E3B866;--honey-soft:#3A2E17;--rose:#E8897C;--rose-soft:#3D2220;
  --sky:#A9BEEB;--sky-soft:#1F2A40;
  --bg:#16121B;--card:#211B29;--ink:#F1ECF7;--muted:#B2A8C2;--line:#382F45;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--plum-2);outline-offset:2px}
h1,h2,h3,.brand,.btn,.seg button{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-weight:600}
h1,h2,h3{line-height:1.2;margin:0}
a{color:var(--plum)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* top bar */
.bar{display:flex;align-items:center;gap:14px;padding:14px clamp(16px,4vw,40px);background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.bar.clear{background:transparent;border-color:transparent;position:static}
.brand{font-size:24px;color:var(--plum);text-decoration:none;display:flex;align-items:center;gap:10px;font-weight:600}
.brand svg{width:30px;height:30px}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.who{font-size:14px;color:var(--muted);text-align:right;line-height:1.3}
.who b{display:block;color:var(--ink);font-weight:700}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 16px;cursor:pointer;color:var(--muted);font-size:15px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--plum);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:var(--bg)}}

main{max-width:1120px;margin:0 auto;padding:clamp(20px,4vw,40px) clamp(16px,4vw,40px) 64px}
.btn{border:0;background:var(--plum);color:#fff;border-radius:999px;padding:11px 22px;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block;font-weight:500}
.btn.ghost{background:var(--card);color:var(--plum);border:1.5px solid var(--line)}
.btn.small{padding:6px 14px;font-size:14px}
.btn.quiet{background:none;color:var(--muted);padding:6px 8px;font-size:14px;font-family:Nunito,sans-serif;font-weight:700;text-decoration:underline}
.btn:disabled{opacity:.5;cursor:wait}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.quiet){color:var(--bg)}}
.note{color:var(--muted);font-size:14.5px}
.msg{border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:700;font-size:14px}
.msg.err{background:var(--rose-soft);color:var(--rose)}.msg.ok{background:var(--sage-soft);color:var(--sage)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 26px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 5px}
input[type=text],input[type=email],input[type=password]{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 13px}
.full{width:100%;margin-top:18px}

/* landing */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,56px);align-items:center;padding:clamp(10px,3vw,30px) 0 clamp(30px,5vw,60px)}
.hero h1{font-size:clamp(36px,5.2vw,60px);color:var(--plum-deep);letter-spacing:-.01em;font-weight:600}
.hero p{font-size:18.5px;color:var(--muted);max-width:34em;margin:18px 0 26px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.branch{width:100%;height:auto;display:block}
.branch .lbl{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:21px;fill:var(--plum)}
.branch .sub{font-family:Nunito,sans-serif;font-size:14px;fill:var(--muted);font-weight:700}
.branch .wood{stroke:var(--plum);fill:none;stroke-linecap:round}
.branch .leaf{fill:var(--leaf)}
.branch .nest{fill:var(--honey-soft);stroke:var(--honey);stroke-width:2.5}
.branch .weave{stroke:var(--honey);stroke-width:2;fill:none;stroke-linecap:round}
.branch .bird{fill:var(--sky)}
.branch .beak{fill:var(--honey)}
@media (max-width:820px){.hero{grid-template-columns:1fr}.branch{max-width:520px;margin:0 auto}}

.section{padding:clamp(28px,4vw,44px) 0;border-top:1px solid var(--line)}
.section h2{font-size:clamp(26px,3vw,34px);color:var(--plum-deep);margin-bottom:6px}
.section > .note{font-size:16.5px;margin:0 0 24px;max-width:40em}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.mod{background:var(--card);padding:22px 24px;display:grid;grid-template-columns:14px 1fr;gap:4px 14px;align-items:start;align-content:start}
.mod i{width:14px;height:14px;border-radius:50%;margin-top:7px;grid-row:span 2}
.mod h3{font-size:20px;color:var(--ink);font-weight:500;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mod p{margin:0;color:var(--muted);font-size:15px}
.tag{font-family:Nunito,sans-serif;font-size:12.5px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--honey-soft);color:var(--honey)}
.tag.live{background:var(--sage-soft);color:var(--sage)}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;counter-reset:s}
.steps li{counter-increment:s;padding-top:6px}
.steps li::before{content:counter(s);font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--plum-soft);color:var(--plum);margin-bottom:12px}
.steps b{display:block;font-size:17px;margin-bottom:4px}
.steps span{color:var(--muted);font-size:15px}
.closing{text-align:center;padding:clamp(34px,5vw,56px) 0 10px}
.closing h2{font-size:clamp(26px,3vw,34px);color:var(--plum-deep);margin-bottom:18px}
footer{color:var(--muted);font-size:13.5px;text-align:center;padding:24px 0 0}

/* auth */
.narrow{max-width:440px;margin:clamp(10px,4vw,40px) auto}
.tabs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:6px}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--plum);color:#fff}
.link{background:none;border:0;color:var(--plum);font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:18px}

/* signed-in pages */
.ptitle{font-size:clamp(28px,3.4vw,38px);color:var(--plum-deep)}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.phead p{margin:6px 0 0}
.open{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.openmod{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px 20px;display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--c)}
.openmod h3{font-size:22px;font-weight:500}
.openmod p{margin:0 0 12px;color:var(--muted);font-size:15px;flex:1}
.openmod .btn{align-self:flex-start}
.later{margin-top:28px}
.later h2{font-size:18px;font-weight:500;color:var(--muted);margin-bottom:10px}
.later ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.later li{background:var(--card);border:1px dashed var(--line);border-radius:999px;padding:6px 14px;font-size:14.5px;color:var(--muted);font-weight:700}

/* admin */
.summary{display:flex;gap:10px;flex-wrap:wrap}
.summary span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.summary span b{color:var(--plum)}
.school{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-bottom:18px;overflow:hidden}
.school.pending{border-color:var(--honey)}
.shead{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:20px 24px}
.crest{width:54px;height:54px;border-radius:16px;background:var(--plum-soft);color:var(--plum);display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:600;font-size:20px;overflow:hidden}
.crest img{width:100%;height:100%;object-fit:contain;background:#fff}
.shead h3{font-size:22px;font-weight:500}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:14px;margin-top:4px}
.code{font-family:Nunito,sans-serif;font-weight:800;letter-spacing:.08em;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:1px 8px;cursor:pointer}
.sact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:13px;font-weight:800;padding:4px 12px;border-radius:999px}
.pill.active{background:var(--sage-soft);color:var(--sage)}.pill.pending{background:var(--honey-soft);color:var(--honey)}.pill.suspended{background:var(--rose-soft);color:var(--rose)}
.switches{border-top:1px solid var(--line);padding:16px 24px 20px;background:color-mix(in srgb,var(--bg) 55%,var(--card))}
.switches h4{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:800}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.toggle{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:0;cursor:pointer;font-weight:600}
.toggle span{flex:1;line-height:1.3}
.toggle small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.toggle input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--sage)}
.toggle input:checked::after{transform:translateX(18px)}
.saved{font-size:13px;font-weight:700;color:var(--muted);min-height:18px;margin-top:8px}
@media (max-width:640px){.shead{grid-template-columns:auto 1fr}.sact{grid-column:1/-1;justify-content:flex-start}}
</style>
</head>
<body>
<header class="bar" id="bar">
  <a class="brand" href="./" id="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 30 C14 26 26 26 36 22" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="22" cy="21" rx="9" ry="5" fill="var(--honey-soft)" stroke="var(--honey)" stroke-width="2"/><circle cx="22" cy="13" r="6" fill="var(--sky)"/><path d="M27 12 l5 1.5 -5 1.5z" fill="var(--honey)"/></svg><span id="brandName">School Hub</span></a>
  <div class="right" id="right"></div>
</header>
<main id="app"><p class="note">Loading…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* Change this one line when the platform has its name */
const PLATFORM = "School Hub";

const SUPABASE_URL = "https://gvhzbxpgebgjnegdiijp.supabase.co";
const SUPABASE_KEY = "sb_publishable_aEQ4MVt00kNu8PaVtrNnqQ_9guhxPYM";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* The parts of the platform. "url" is set once a part is ready to open. */
const MODULES = [
  { id: "twignest",  name: "TwigNest",       colour: "var(--sky)",    desc: "Baseline, attainment and progress for every student, with next steps and report comments drafted from the data.", url: "https://twignest-app.github.io/" },
  { id: "grownest",  name: "GrowNest",       colour: "var(--sage)",   desc: "Learning walks, formal observations and appraisals against the MOE framework, with feedback emailed to teachers.", url: "https://grownest-teacher.com/" },
  { id: "planning",  name: "Planning",       colour: "var(--honey)",  desc: "A curriculum coverage map showing what each grade has taught and assessed, with unit planning to follow.", url: "planning.html" },
  { id: "inclusion", name: "Inclusion",      colour: "var(--plum-2)", desc: "Support plans, targets and provision for students who need extra help or challenge." },
  { id: "wellbeing", name: "Wellbeing",      colour: "var(--rose)",   desc: "Short daily check-ins, so the right adult hears when a student needs to talk." },
  { id: "evidence",  name: "Evidence packs", colour: "var(--muted)",  desc: "Inspection evidence gathered from every part of the platform into editable Word documents." }
];
const ROLES = { admin: "Admin", school_lead: "School leader", coordinator: "Coordinator", teacher: "Teacher", checker: "Buddy checker" };

const app = document.getElementById("app"), right = document.getElementById("right");
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const here = location.origin + location.pathname;
let authTab = "landing", recovering = false, adminTab = "schools";
document.title = PLATFORM;
document.getElementById("brandName").textContent = PLATFORM;
document.getElementById("brand").onclick = e => { e.preventDefault(); if (authTab !== "landing") { authTab = "landing"; } render(); };

function friendly(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login/i.test(m)) return "The email or password is not correct.";
  if (/Email not confirmed/i.test(m)) return "Please confirm your email first. Check your inbox for the confirmation link.";
  if (/already registered/i.test(m)) return "An account with this email already exists. Try signing in instead.";
  if (/Password should be/i.test(m)) return "The password needs at least 8 characters.";
  if (/rate limit/i.test(m)) return "Too many attempts. Please wait a few minutes and try again.";
  return m;
}
function show(el, text, kind){ el.innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : ""; }
async function busy(btn, fn){ btn.disabled = true; try { await fn(); } finally { btn.disabled = false; } }
const initials = n => String(n || "?").split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();

/* ---------- The one landing page ---------- */
function branchArt(){
  const nest = (x, y, name, sub) => `<g transform="translate(${x} ${y})">
      <text class="lbl" x="0" y="-58" text-anchor="middle">${name}</text><text class="sub" x="0" y="-38" text-anchor="middle">${sub}</text>
      <path class="weave" d="M-40 -2 q40 24 80 0"/><ellipse class="nest" cx="0" cy="-4" rx="42" ry="14"/>
      <path class="weave" d="M-32 -6 q32 12 64 0 M-25 0 q25 9 50 0"/></g>`;
  return `<svg class="branch" viewBox="0 0 600 380" role="img" aria-label="A branch holding three nests: TwigNest, GrowNest and Planning">
    <path class="wood" stroke-width="16" d="M0 330 C140 318 250 280 330 250 S500 180 600 150"/>
    <path class="wood" stroke-width="8" d="M250 282 C270 330 300 350 330 356"/>
    <path class="leaf" d="M330 356 c22 -14 52 -8 60 6 c-20 14 -48 10 -60 -6z"/>
    <path class="leaf" d="M60 326 c-10 -26 4 -52 20 -56 c10 22 0 46 -20 56z"/>
    <path class="leaf" d="M424 226 c18 16 18 42 6 50 c-16 -14 -18 -36 -6 -50z"/>
    <path class="leaf" d="M560 158 c18 -20 44 -20 52 -10 c-14 18 -38 20 -52 10z"/>
    ${nest(130, 318, "TwigNest", "Student progress")}
    ${nest(330, 252, "GrowNest", "Teacher growth")}
    ${nest(510, 178, "Planning", "Curriculum")}
    <g transform="translate(220 112)"><ellipse class="bird" cx="0" cy="0" rx="28" ry="21"/><circle class="bird" cx="20" cy="-17" r="14"/>
      <path class="beak" d="M33 -19 l15 4 -15 5z"/><circle cx="24" cy="-20" r="2.4" fill="var(--plum-deep)"/>
      <path d="M-30 -2 q-16 -4 -22 6 q12 2 22 2z" class="bird"/></g>
  </svg>`;
}
function landingView(){
  document.body.classList.add("auth");
  right.innerHTML = `<button class="btn ghost small" data-auth="signin">Sign in</button>`;
  const live = MODULES.filter(m => m.url), soon = MODULES.filter(m => !m.url);
  app.innerHTML = `<section class="hero">
      <div><h1>Everything your school tracks, in one place</h1>
        <p>Student progress, lesson observations and curriculum coverage, built on one shared school setup. Add your school, staff and classes once, and every part of ${esc(PLATFORM)} uses them.</p>
        <div class="acts"><button class="btn" data-auth="signup">Register your school</button><button class="btn ghost" data-auth="signin">Sign in</button></div></div>
      ${branchArt()}
    </section>
    <section class="section"><h2>What’s inside</h2><p class="note">Each school chooses the parts it needs. Everything shares the same students, staff and curriculum.</p>
      <div class="mods">${live.concat(soon).map(m => `<div class="mod"><i style="background:${m.colour}"></i>
        <h3>${esc(m.name)} <span class="tag ${m.url ? "live" : ""}">${m.url ? "Ready" : "Coming soon"}</span></h3><p>${esc(m.desc)}</p></div>`).join("")}</div></section>
    <section class="section"><h2>How your school joins</h2><p class="note">It takes a few minutes for a school leader to set up.</p>
      <ol class="steps"><li><b>Register your school</b><span>A school leader creates an account and enters the school’s name.</span></li>
        <li><b>We approve it</b><span>We check every school before it goes live, usually within a day.</span></li>
        <li><b>Invite your staff</b><span>Teachers join with your school’s code, and you approve each one.</span></li>
        <li><b>Switch on what you need</b><span>Start with one part and add the others whenever you’re ready.</span></li></ol></section>
    <section class="closing"><h2>Bring your school’s data together</h2><button class="btn" data-auth="signup">Register your school</button>
      <footer>${esc(PLATFORM)} brings together TwigNest, GrowNest and Planning.</footer></section>`;
  document.querySelectorAll("[data-auth]").forEach(b => b.onclick = () => { authTab = b.dataset.auth; authView(); window.scrollTo(0, 0); });
}

function authView(){
  if (authTab === "landing") return landingView();
  document.body.classList.add("auth");
  right.innerHTML = "";
  app.innerHTML = `<div class="narrow">
    <div class="panel">
      ${authTab !== "forgot" ? `<div class="tabs" role="group" aria-label="Account">
        <button data-tab="signin" aria-pressed="${authTab === "signin"}">Sign in</button>
        <button data-tab="signup" aria-pressed="${authTab === "signup"}">Create account</button></div>` : `<h2 style="font-size:24px;color:var(--plum-deep)">Reset your password</h2>`}
      <form id="authForm">
        ${authTab === "signup" ? `<label for="name">Full name</label><input id="name" type="text" autocomplete="name" required>` : ""}
        <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
        ${authTab !== "forgot" ? `<label for="pw">Password</label><input id="pw" type="password" minlength="8" autocomplete="${authTab === "signup" ? "new-password" : "current-password"}" required>` : ""}
        <button class="btn full" id="authBtn" type="submit">${authTab === "signin" ? "Sign in" : authTab === "signup" ? "Create account" : "Send reset link"}</button>
      </form>
      ${authTab === "signin" ? `<p class="note" style="margin:14px 0 0"><button class="link" data-tab="forgot">Forgot your password?</button></p>` : ""}
      ${authTab === "forgot" ? `<p class="note" style="margin:14px 0 0"><button class="link" data-tab="signin">Back to sign in</button></p>` : ""}
      <div id="authMsg"></div>
    </div>
    <p class="note" style="text-align:center;margin-top:16px"><button class="link" data-tab="landing">Back to the home page</button></p></div>`;
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { authTab = b.dataset.tab; authView(); });
  document.getElementById("authForm").onsubmit = e => { e.preventDefault();
    const btn = document.getElementById("authBtn"), msg = document.getElementById("authMsg");
    busy(btn, async () => {
      const email = document.getElementById("email").value.trim();
      if (authTab === "signin") {
        const { error } = await sb.auth.signInWithPassword({ email, password: document.getElementById("pw").value });
        if (error) return show(msg, friendly(error), "err");
      } else if (authTab === "signup") {
        const { error } = await sb.auth.signUp({ email, password: document.getElementById("pw").value,
          options: { data: { full_name: document.getElementById("name").value.trim() }, emailRedirectTo: here } });
        if (error) return show(msg, friendly(error), "err");
        show(msg, "Account created. Check your email and tap the confirmation link, then sign in here.", "ok");
      } else {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: here });
        if (error) return show(msg, friendly(error), "err");
        show(msg, "If this email has an account, a reset link is on its way.", "ok");
      }
    }); };
}

function resetView(){
  document.body.classList.add("auth");
  right.innerHTML = "";
  app.innerHTML = `<div class="narrow panel"><h2 style="font-size:24px;color:var(--plum-deep)">Choose a new password</h2>
    <form id="rf"><label for="np">New password</label><input id="np" type="password" minlength="8" autocomplete="new-password" required>
    <button class="btn full" id="rb" type="submit">Save new password</button></form><div id="rm"></div></div>`;
  document.getElementById("rf").onsubmit = e => { e.preventDefault(); const btn = document.getElementById("rb");
    busy(btn, async () => { const { error } = await sb.auth.updateUser({ password: document.getElementById("np").value });
      if (error) return show(document.getElementById("rm"), friendly(error), "err");
      recovering = false; render(); }); };
}

/* ---------- Signed in ---------- */
function topBar(p){
  document.body.classList.remove("auth");
  const nav = p.platform_admin && p.school_id ? `<div class="seg" role="group" aria-label="View">
      <button data-at="school" aria-pressed="${adminTab === "school"}">My school</button><button data-at="schools" aria-pressed="${adminTab === "schools"}">All schools</button></div>` : "";
  right.innerHTML = `${nav}<div class="who"><b>${esc(p.full_name || p.email)}</b>${p.platform_admin ? "Platform admin" : esc(ROLES[p.role] || "")}</div>
    <button class="btn ghost small" id="out">Sign out</button>`;
  right.querySelectorAll("[data-at]").forEach(b => b.onclick = () => { adminTab = b.dataset.at; render(); });
  document.getElementById("out").onclick = async () => { await sb.auth.signOut(); authTab = "landing"; adminTab = "schools"; render(); };
}

function chooseView(p){
  app.innerHTML = `<div class="phead"><div><h1 class="ptitle">Welcome, ${esc((p.full_name || "").split(" ")[0])}</h1>
      <p class="note">Is your school new to ${esc(PLATFORM)}, or has it already joined?</p></div></div>
    <div class="grid2">
      <div class="panel"><h2 style="font-size:22px">Register my school</h2><p class="note">For school leaders. We’ll check and approve your school, then you can invite your staff.</p>
        <form id="regF"><label for="sn">School name</label><input id="sn" type="text" required>
        <label for="sc">Country</label><input id="sc" type="text" value="United Arab Emirates" required>
        <button class="btn full" id="regB" type="submit">Register school</button></form><div id="regM"></div></div>
      <div class="panel"><h2 style="font-size:22px">Join my school</h2><p class="note">For teachers. Ask your school leader for your school’s 8-character code.</p>
        <form id="joinF"><label for="jc">School code</label><input id="jc" type="text" maxlength="8" style="text-transform:uppercase;letter-spacing:.15em" required>
        <button class="btn full" id="joinB" type="submit">Join school</button></form><div id="joinM"></div></div>
    </div>`;
  document.getElementById("regF").onsubmit = e => { e.preventDefault(); busy(document.getElementById("regB"), async () => {
    const { error } = await sb.rpc("hub_register_school", { p_name: document.getElementById("sn").value, p_country: document.getElementById("sc").value });
    if (error) return show(document.getElementById("regM"), friendly(error), "err"); render(); }); };
  document.getElementById("joinF").onsubmit = e => { e.preventDefault(); busy(document.getElementById("joinB"), async () => {
    const { error } = await sb.rpc("hub_join_school", { p_code: document.getElementById("jc").value });
    if (error) return show(document.getElementById("joinM"), friendly(error), "err"); render(); }); };
}

function waitView(title, text){
  app.innerHTML = `<div class="narrow panel" style="text-align:center"><h2 style="font-size:24px;color:var(--plum-deep)">${esc(title)}</h2><p class="note">${esc(text)}</p>
    <button class="btn ghost" id="chk">Check again</button></div>`;
  document.getElementById("chk").onclick = render;
}

function homeView(p, school){
  const on = school.modules || [];
  const ready = MODULES.filter(m => on.includes(m.id) && m.url), later = MODULES.filter(m => on.includes(m.id) && !m.url);
  const first = (p.full_name || "").split(" ")[0], hr = new Date().getHours();
  const greet = hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening";
  app.innerHTML = `<div class="phead"><div><h1 class="ptitle">${greet}, ${esc(first)}</h1><p class="note">${esc(school.name)}</p></div></div>
    ${ready.length ? `<div class="open">${ready.map(m => `<div class="openmod" style="--c:${m.colour}"><h3>${esc(m.name)}</h3><p>${esc(m.desc)}</p>
        <a class="btn" href="${esc(m.url)}">Open ${esc(m.name)}</a></div>`).join("")}</div>`
      : `<div class="panel"><p class="note" style="margin:0">No parts of ${esc(PLATFORM)} are switched on for your school yet.</p></div>`}
    ${later.length ? `<div class="later"><h2>Coming soon for your school</h2><ul>${later.map(m => `<li>${esc(m.name)}</li>`).join("")}</ul></div>` : ""}`;
}

async function adminView(){
  app.innerHTML = `<p class="note">Loading schools…</p>`;
  const { data: schools, error } = await sb.from("schools").select("*").order("created_at", { ascending: false });
  if (error) return show(app, friendly(error), "err");
  const { data: people } = await sb.from("profiles").select("id,full_name,email,school_id,active");
  const P = people || [], byId = id => P.find(x => x.id === id);
  const staff = sid => P.filter(x => x.school_id === sid && x.active).length;
  const waiting = schools.filter(s => s.status === "pending"), others = schools.filter(s => s.status !== "pending");
  const LABEL = { active: "Active", pending: "Waiting for approval", suspended: "Suspended" };
  const card = s => { const l = byId(s.created_by), on = s.modules || [], n = staff(s.id);
    return `<article class="school ${s.status === "pending" ? "pending" : ""}" data-sid="${s.id}">
      <div class="shead"><div class="crest">${s.logo_url ? `<img src="${esc(s.logo_url)}" alt="">` : esc(initials(s.name))}</div>
        <div><h3>${esc(s.name)}</h3><div class="facts">
          ${s.emirate || s.country ? `<span>${esc(s.emirate || s.country)}</span>` : ""}
          <span>${n} active staff</span>
          ${l ? `<span>Registered by ${esc(l.full_name || l.email)}</span>` : ""}
          <span>School code <button class="code" type="button" data-copy="${esc(s.join_code)}" title="Copy the school code">${esc(s.join_code)}</button></span></div></div>
        <div class="sact"><span class="pill ${esc(s.status)}">${LABEL[s.status] || esc(s.status)}</span>
          ${s.status !== "active" ? `<button class="btn small" data-st="active">${s.status === "pending" ? "Approve" : "Reactivate"}</button>` : ""}
          ${s.status === "active" ? `<button class="btn quiet" data-st="suspended">Suspend</button>` : ""}</div></div>
      <div class="switches"><h4>Parts switched on for this school</h4><div class="sw">
        ${MODULES.map(m => `<label class="toggle"><span>${esc(m.name)}<small>${m.url ? "Ready" : "Coming soon"}</small></span>
          <input type="checkbox" role="switch" value="${m.id}" ${on.includes(m.id) ? "checked" : ""} aria-label="${esc(m.name)} for ${esc(s.name)}"></label>`).join("")}</div>
        <div class="saved" aria-live="polite"></div></div></article>`; };
  app.innerHTML = `<div class="phead"><div><h1 class="ptitle">Schools</h1><p class="note">Approve schools and choose which parts of ${esc(PLATFORM)} each one uses.</p></div>
      <div class="summary"><span><b>${schools.length}</b> school${schools.length === 1 ? "" : "s"}</span><span><b>${waiting.length}</b> waiting for approval</span></div></div>
    ${!schools.length ? `<div class="panel"><p class="note" style="margin:0">No schools have registered yet. When a school leader registers, their school appears here for you to approve.</p></div>` : ""}
    ${waiting.map(card).join("")}${others.map(card).join("")}`;
  app.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); const t = b.textContent; b.textContent = "Copied"; setTimeout(() => { b.textContent = t; }, 1200); } catch (_) {} });
  app.querySelectorAll(".school").forEach(art => {
    const sid = art.dataset.sid, note = art.querySelector(".saved");
    art.querySelectorAll("[data-st]").forEach(b => b.onclick = () => busy(b, async () => {
      if (b.dataset.st === "suspended" && !confirm("Suspend this school? Its staff lose access until you reactivate it.")) return;
      const { error } = await sb.rpc("set_school_status", { p_school: sid, p_status: b.dataset.st });
      if (error) return alert(friendly(error)); adminView(); }));
    art.querySelectorAll(".toggle input").forEach(c => c.onchange = async () => {
      const mods = [...art.querySelectorAll(".toggle input:checked")].map(x => x.value);
      note.textContent = "Saving…";
      const { error } = await sb.rpc("set_school_modules", { p_school: sid, p_modules: mods });
      if (error) { c.checked = !c.checked; note.textContent = "Not saved: " + friendly(error); return; }
      const name = MODULES.find(m => m.id === c.value).name;
      note.textContent = `${name} ${c.checked ? "switched on" : "switched off"}.`;
    });
  });
}

async function render(){
  if (recovering) return resetView();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return authView();
  const { data: p, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !p) { right.innerHTML = ""; app.innerHTML = `<div class="narrow panel"><div class="msg err">Your account couldn’t be loaded. Sign out and sign in again.</div>
    <button class="btn ghost full" id="out2">Sign out</button></div>`; document.getElementById("out2").onclick = async () => { await sb.auth.signOut(); render(); }; return; }
  topBar(p);
  if (p.platform_admin && (!p.school_id || adminTab === "schools")) return adminView();
  if (!p.school_id) return chooseView(p);
  const { data: school } = await sb.from("schools").select("*").eq("id", p.school_id).single();
  if (!school) return waitView("Almost there", "Your school couldn’t be found. Please get in touch with us.");
  if (school.status === "pending") return waitView(`${school.name} is waiting for approval`, "We’ll check your school soon. You can set it up as soon as it’s approved.");
  if (school.status === "suspended") return waitView("Access paused", `${school.name}’s access is paused. Please get in touch with us.`);
  if (!p.active) return waitView("Waiting for your school leader", `You’ve joined ${school.name}. Your school leader needs to approve your account before you can start.`);
  homeView(p, school);
}

sb.auth.onAuthStateChange(event => {
  if (event === "PASSWORD_RECOVERY") { recovering = true; resetView(); return; }
  if (event === "SIGNED_IN" || event === "SIGNED_OUT") setTimeout(render, 0);
});
render();
</script>
</body>
</html>
