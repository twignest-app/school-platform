<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings · Nestopia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--plum:#462D5B;--plum-2:#6A4B85;--plum-soft:#EDE6F5;--sage:#5E8455;--sage-soft:#E6EFE2;--amber:#A86C12;--amber-soft:#FBF0DC;--red:#B4473A;--red-soft:#F8E4E1;--blue:#4E6FB8;--blue-soft:#E4EBF8;--bg:#F7F4FB;--card:#FFFFFF;--ink:#2E2140;--muted:#6F6680;--line:#E4DDEE;--empty:#ECE7F3;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--plum:#CDB9EA;--plum-2:#DCCCF2;--plum-soft:#352A45;--sage:#A7C59A;--sage-soft:#26331F;--amber:#E6B566;--amber-soft:#3A2E17;--red:#E8897C;--red-soft:#3D2220;--blue:#9DB4E8;--blue-soft:#1E2A40;--bg:#17131D;--card:#221C2B;--ink:#F1ECF7;--muted:#B2A8C2;--line:#382F45;--empty:#2C2536;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--plum-2);outline-offset:2px}
h1,h2,h3,.btn,.brand{font-family:"Poppins","Nunito",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;font-size:22px;color:var(--plum);text-decoration:none}
header .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
main{max-width:1200px;margin:0 auto;padding:24px 20px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:18px}
.card h2{margin:0 0 8px;font-size:20px;color:var(--plum);font-weight:600}
.btn{border:0;background:var(--plum);color:#fff;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--bg);color:var(--plum);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.note{color:var(--muted);font-size:14px}
.msg{border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:600;font-size:14px;background:var(--red-soft);color:var(--red)}
.ptitle{margin:0 0 4px;font-weight:600;font-size:26px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.metric span{display:block;font-size:13px;color:var(--muted);font-weight:700}
.metric b{display:block;font-size:26px;color:var(--plum);font-family:Poppins,Nunito,sans-serif;font-weight:600;line-height:1.3}
.tablewrap{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:8px;min-width:100%}
table.grid th{font-size:13px;color:var(--muted);text-align:left;font-weight:700;padding:4px}
.cell{width:100%;min-width:150px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;display:block}
.cell:hover{border-color:var(--plum-2)}
.cell b{font-size:20px;font-family:Poppins,Nunito,sans-serif;font-weight:600;color:var(--plum)}
.cell small{display:block;color:var(--muted);font-size:12.5px}
.cell.none{cursor:default;color:var(--muted);background:var(--bg)}
.cell.on{outline:3px solid var(--plum-2)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--empty);margin:6px 0 4px}
.bar i{display:block;height:100%}
.bar .a{background:var(--sage)}.bar .t{background:var(--amber)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
h3.strand{font-size:16px;font-weight:600;margin:18px 0 6px;color:var(--ink)}
.obj{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.obj:last-child{border-bottom:0}
.st{font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px;justify-self:start}
.st.n{background:var(--empty);color:var(--muted)}.st.p{background:var(--amber-soft);color:var(--amber)}.st.t{background:var(--blue-soft);color:var(--blue)}.st.a{background:var(--sage-soft);color:var(--sage)}
.obj small{display:block;color:var(--muted);font-size:12.5px}
.sec{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.sec b{display:block;font-size:16px;color:var(--ink)}
@media (max-width:640px){.obj{grid-template-columns:1fr}.sec{text-align:left}}

.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.set .card{margin:0}
.set a.btn{margin-top:8px}
.code{font:inherit;font-size:22px;font-weight:800;letter-spacing:.18em;border:2px dashed var(--line);border-radius:12px;padding:8px 16px;background:var(--card);cursor:pointer}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mods span{font-size:13px;font-weight:700;border-radius:99px;padding:4px 10px;background:var(--plum-soft);color:var(--plum)}
.mods span.off{background:var(--empty);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:50}.toast.on{opacity:1}
</style></head><body>
<header><a class="brand" href="./" id="brand">Nestopia</a><div class="who" id="who"></div></header>
<main id="app"><p class="note">Loading…</p></main>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="hub.js?v=10"></script>
<script src="getstarted.js?v=1"></script>
<script>
const PLATFORM = "Nestopia";
const SUPABASE_URL = "https://gvhzbxpgebgjnegdiijp.supabase.co";
const SUPABASE_KEY = "sb_publishable_aEQ4MVt00kNu8PaVtrNnqQ_9guhxPYM";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app"), who = document.getElementById("who");
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = m => { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2400); };
const ALL = [["twignest", "TwigNest"], ["grownest", "GrowNest"], ["planning", "Planning"], ["inclusion", "Inclusion"], ["wellbeing", "Wellbeing"], ["evidence", "Evidence packs"]];
(async () => {
  const { data: { session } } = await sb.auth.getSession(); if (!session) { location.href = "./"; return; }
  const { data: p } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (!p || !p.school_id) { location.href = "./"; return; }
  who.innerHTML = `<span>${esc(p.full_name || p.email)}</span><a class="btn ghost small" href="./">← ${PLATFORM}</a>`;
  const { data: s } = await sb.from("schools").select("*").eq("id", p.school_id).single();
  const lead = ["school_lead", "coordinator", "admin"].includes(p.role), on = (s && s.modules) || [];
  if (!lead) { app.innerHTML = '<div class="card"><p class="note" style="margin:0">Settings are for school leaders and coordinators.</p></div>'; hubInit("settings"); return; }
  const c = (title, text, links) => `<section class="card"><h2>${title}</h2><p class="note" style="margin:0">${text}</p>${links.map(([h, l]) => `<a class="btn ghost small" href="${h}">${l} →</a>`).join(" ")}</section>`;
  app.innerHTML = `<div class="phead"><div><h1 class="ptitle">Settings</h1><p class="note">${esc(s.name)} · Everything you set up for your school, in one place.</p></div></div>
    <section class="card" id="start" style="margin-bottom:16px"><h2>🚀 Getting started</h2><p class="note" style="margin:0 0 4px">The steps to get your school ready. Each one ticks itself off when it’s done.</p><div id="gs"><p class="note">Checking…</p></div></section>
    <section class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Staff and roles</h2>${on.includes("twignest") ? '<a class="btn ghost small" href="twignest/#staff">Approve staff and change roles →</a>' : ""}</div><div id="staffList" style="margin-top:10px"><p class="note">Loading…</p></div></section>
    <section class="card" id="plan" style="margin-bottom:16px"><h2 style="margin:0 0 8px">⭐ Your plan</h2><div id="planBody"><p class="note">Loading…</p></div></section>
    ${on.includes("parents") ? "" : "<!--"}<section class="card" id="pp" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">👪 Parent portal</h2><span class="note">Parents sign in at <b>nestopia.school/parent.html</b></span></div><div id="ppBody" style="margin-top:10px"><p class="note">Loading…</p></div></section>${on.includes("parents") ? "" : "-->"}
    <div class="set">
      <section class="card"><h2>Your school</h2><p style="margin:0"><b>${esc(s.name)}</b>${s.country ? " · " + esc(s.country) : ""}</p>
        <p class="note" style="margin:12px 0 6px">Teachers join with this code:</p><button class="code" id="code" title="Copy the code">${esc(s.join_code || "")}</button>
        <p class="note" style="margin:12px 0 0"><b>Switched on:</b></p><div class="mods">${ALL.map(([k, n]) => `<span class="${on.includes(k) ? "" : "off"}">${on.includes(k) ? "✓" : "○"} ${n}</span>`).join("")}</div>
        <p class="note" style="margin:8px 0 0">To switch more parts on, contact the Nestopia team.</p></section>
      ${on.includes("twignest") ? c("Staff and roles", "Approve teachers who join with your code, and choose their role: school leader, coordinator, teacher or buddy checker.", [["twignest/#staff", "Staff"]]) : ""}
      ${on.includes("twignest") ? c("Grades, subjects and assessment", "Your grades, subjects, terms, grading scale and student groups, used across Nestopia.", [["twignest/#setup", "Setup"], ["twignest/#classes", "Classes and students"]]) : ""}
      ${on.includes("grownest") ? c("Observations and appraisals", "GrowNest’s observation forms, criteria, staff and settings.", [["grownest/settings.html", "GrowNest settings"], ["grownest/criteria.html", "Criteria"], ["grownest/staff.html", "GrowNest staff"]]) : ""}
      ${on.includes("inclusion") ? c("Inclusion team", "Choose your inclusion head and the staff who manage the inclusion register.", [["inclusion.html", "Inclusion team (in Inclusion)"]]) : ""}
      ${on.includes("wellbeing") ? c("Wellbeing and safeguarding", "Choose your wellbeing team and your safeguarding lead(s). Only they, and school leaders, see safeguarding concerns.", [["wellbeing.html", "Wellbeing team (in Wellbeing)"]]) : ""}
    </div>`;
  gsSteps(sb, s).then(st => { document.getElementById("gs").innerHTML = gsHtml(st, false); if (location.hash === "#start") document.getElementById("start").scrollIntoView(); }).catch(() => { document.getElementById("gs").innerHTML = '<p class="note">Couldn’t check the steps right now.</p>'; });
  (async () => { const R = { school_lead: "School leader", coordinator: "Coordinator", teacher: "Teacher", checker: "Buddy checker", admin: "Admin" };
    let r = await sb.from("profiles").select("full_name,email,role,active,inclusion_head,inclusion_lead,wellbeing_team,safeguarding_lead").eq("school_id", s.id);
    if (r.error) r = await sb.from("profiles").select("full_name,email,role,active").eq("school_id", s.id);
    const list = (r.data || []).sort((a, b) => (a.active === b.active ? 0 : a.active ? 1 : -1) || String(a.full_name).localeCompare(String(b.full_name)));
    const tag = (on2, t) => on2 ? `<span class="mods"><span>${t}</span></span>` : "";
    document.getElementById("staffList").innerHTML = list.length ? `<div class="tablewrap"><table class="reg" style="width:100%;border-collapse:collapse"><tr><th style="text-align:left">Name</th><th style="text-align:left">Role</th><th style="text-align:left">Teams</th><th style="text-align:left">Status</th></tr>${list.map(x => `<tr><td style="padding:8px 4px;border-top:1px solid var(--line)"><b>${esc(x.full_name || "")}</b><br><span class="note">${esc(x.email || "")}</span></td><td style="border-top:1px solid var(--line)">${esc(R[x.role] || x.role || "")}</td>
      <td style="border-top:1px solid var(--line)"><div class="mods">${x.inclusion_head ? "<span>Inclusion head</span>" : x.inclusion_lead ? "<span>Inclusion team</span>" : ""}${x.safeguarding_lead ? "<span>🔒 Safeguarding lead</span>" : ""}${x.wellbeing_team ? "<span>Wellbeing team</span>" : ""}</div></td>
      <td style="border-top:1px solid var(--line)">${x.active ? '<span class="note">Active</span>' : '<b style="color:#B07A1E">Waiting for approval</b>'}</td></tr>`).join("")}</table></div>` : '<p class="note">No staff yet.</p>'; })();
  if (on.includes("parents") && document.getElementById("ppBody")) parentPortal(s);
  planCard(s, p);
  document.getElementById("code").onclick = async () => { try { await navigator.clipboard.writeText(s.join_code); toast("Code copied"); } catch (_) {} };
  hubInit("settings");
})();
async function planCard(s, me){
  const box = document.getElementById("planBody"); if (!box) return;
  const { data: plans, error } = await sb.from("nest_plans").select("*").eq("active", true).order("sort");
  if (error) { box.innerHTML = '<p class="note">Plans aren’t set up yet.</p>'; return; }
  const mine = (plans || []).find(x => x.id === s.plan_id), ST = { trial: "Free trial", active: "Active", past_due: "Payment due", cancelled: "Cancelled" };
  const { data: rq } = await sb.from("plan_requests").select("plan_id,status,created_at").eq("school_id", String(s.id)).eq("status", "pending");
  const pending = (rq || [])[0];
  const trialLeft = s.trial_ends ? Math.ceil((new Date(s.trial_ends + "T00:00:00") - new Date()) / 864e5) : null;
  box.innerHTML = `<p style="margin:0"><b style="font-size:20px">${esc(mine ? mine.name : "No plan chosen yet")}</b> <span class="note">· ${ST[s.subscription_status] || "Free trial"}</span></p>
    ${(s.subscription_status || "trial") === "trial" && trialLeft != null ? `<p style="margin:6px 0 0;color:${trialLeft < 0 ? "#B4473A" : trialLeft <= 7 ? "#A86C12" : "inherit"}">${trialLeft < 0 ? "Your free trial has ended. Choose a plan below to keep using Nestopia." : `Your free trial ends in <b>${trialLeft} day${trialLeft === 1 ? "" : "s"}</b> (${esc(s.trial_ends)}).`}</p>` : ""}
    ${s.renews_on ? `<p class="note" style="margin:4px 0 0">Renews on ${esc(s.renews_on)}</p>` : ""}
    ${pending ? `<p class="note" style="margin:8px 0 0">⏳ You asked to change to <b>${esc(((plans || []).find(x => x.id === pending.plan_id) || {}).name || "another plan")}</b>. The Nestopia team will confirm it soon.</p>` : ""}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px">${(plans || []).map(pl => `<div style="border:2px solid ${pl.id === s.plan_id ? "var(--plum)" : "var(--line)"};border-radius:14px;padding:12px 14px;background:var(--card)">
      <b>${esc(pl.name)}</b>${pl.highlight ? ' <span class="mods"><span>Most popular</span></span>' : ""}<br><span class="note">${esc(pl.price_text || "")}</span>
      <ul class="note" style="margin:8px 0;padding-left:18px">${(pl.features || []).map(f => `<li>${esc(f)}</li>`).join("")}</ul>
      ${pl.id === s.plan_id ? '<b style="color:var(--plum)">✓ Your plan</b>' : me.role === "school_lead" && !pending ? `<button class="btn ghost small" data-req="${pl.id}">Request this plan</button>` : ""}</div>`).join("")}</div>`;
  box.querySelectorAll("[data-req]").forEach(b => b.onclick = async () => { const note = prompt("Anything we should know? (optional, for example: number of students)", ""); if (note === null) return;
    const { error: e2 } = await sb.from("plan_requests").insert({ school_id: String(s.id), plan_id: b.dataset.req, requested_by: me.id, note: note.trim() || null });
    if (e2) return toast(e2.message); toast("Request sent. The Nestopia team will confirm it."); planCard(s, me); });
}
async function parentPortal(s){
  const box = document.getElementById("ppBody");
  const D = { reports: ["Report cards (approved comments only)", true], attendance: ["Attendance", true], merits: ["Merits", true], incidents: ["Behaviour incidents", false], calendar: ["School calendar", true], conferences: ["Booking parent conferences", true] };
  const st = await sb.from("parent_portal_settings").select("config").eq("school_id", s.id).maybeSingle();
  if (st.error && /parent_/.test(st.error.message)) { box.innerHTML = '<p class="note">The parent portal needs its database step first. Please run the Parent portal update in Supabase.</p>'; return; }
  const cfg = Object.assign(Object.fromEntries(Object.entries(D).map(([k, v]) => [k, v[1]])), (st.data && st.data.config) || {});
  // codes are made automatically for any student who doesn't have one yet
  try { await sb.rpc("parent_make_codes"); } catch (_) {}
  const codes = (await sb.from("parent_codes").select("student_id,code").eq("school_id", s.id)).data || [];
  const links = (await sb.from("parent_links").select("student_id,parent_name,relationship,created_at").eq("school_id", s.id)).data || [];
  const studs = []; for (let k = 0; k < codes.length; k += 200) { const { data } = await sb.from("students").select("id,full_name,class_id,classes(name)").in("id", codes.slice(k, k + 200).map(x => x.student_id)); studs.push(...(data || [])); }
  const base = location.origin + "/parent.html";
  const rows = codes.map(c => { const x = studs.find(y => String(y.id) === String(c.student_id)) || {}; return { name: x.full_name || "", first: (x.full_name || "").split(" ")[0], cls: (x.classes && x.classes.name) || "", code: c.code, link: base + "?code=" + c.code, parents: links.filter(l => String(l.student_id) === String(c.student_id)) }; })
    .sort((a, b) => a.cls.localeCompare(b.cls, undefined, { numeric: true }) || a.name.localeCompare(b.name));
  const classes2 = [...new Set(rows.map(r => r.cls))];
  window.PP_CLASS = window.PP_CLASS && classes2.includes(window.PP_CLASS) ? window.PP_CLASS : classes2[0];
  const invite = r => `Dear parent, ${s.name} invites you to the Nestopia parent portal for ${r.first}: school news, messages with teachers, reports, attendance and merits. Tap this link and create your account (${r.first} is added automatically): ${r.link}\n\nعزيزي وليّ الأمر، تدعوك المدرسة إلى بوابة أولياء الأمور في Nestopia لمتابعة ${r.first}. اضغط على الرابط وأنشئ حسابك: ${r.link}`;
  const shown = rows.filter(r => r.cls === window.PP_CLASS), joined = rows.filter(r => r.parents.length).length;
  box.innerHTML = `<p class="note" style="margin-top:0">Send each family their <b>invite link</b>. They tap it, create an account, and their child is added automatically. No code to type.</p>
    <p style="margin:0 0 10px"><b>${joined} of ${rows.length}</b> <span class="note">families have joined</span></p>
    ${rows.length ? `<div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><select id="ppCls" aria-label="Class">${classes2.map(c => `<option ${c === window.PP_CLASS ? "selected" : ""}>${esc(c || "No class")}</option>`).join("")}</select>
      <button class="btn ghost small" id="ppCopyCls">📋 Copy all invites for this class</button><button class="btn ghost small" id="ppSlips">⬇ Word: printable slips</button><button class="btn ghost small" id="ppCsv">⬇ CSV</button></div>
      <div class="tablewrap"><table class="reg" style="width:100%">${shown.map((r, i) => `<tr><td style="padding:8px 4px;border-top:1px solid var(--line)"><b>${esc(r.name)}</b><br><span class="note">Code ${esc(r.code)}</span></td>
        <td style="border-top:1px solid var(--line)">${r.parents.length ? `<span style="color:#3F8A4B;font-weight:800">✓ Joined</span><br><span class="note">${r.parents.map(p => esc(p.parent_name || "Parent") + (p.relationship ? " (" + esc(p.relationship) + ")" : "")).join(", ")}</span>` : '<span class="note">Not joined yet</span>'}</td>
        <td style="border-top:1px solid var(--line);text-align:right;white-space:nowrap"><button class="btn ghost small" data-inv="${i}">📋 Copy invite</button> <a class="btn ghost small" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(invite(r))}">WhatsApp</a></td></tr>`).join("")}</table></div>` : '<p class="note">Add students in TwigNest first.</p>'}
    <details style="margin-top:14px"><summary class="note">What parents can see</summary><p class="note">Parents never see inclusion, wellbeing or safeguarding records.</p>
      <div class="mods" style="gap:10px">${Object.entries(D).map(([k, v]) => `<label style="display:flex;gap:6px;align-items:center;font-weight:700"><input type="checkbox" data-pp="${k}" ${cfg[k] ? "checked" : ""}> ${v[0]}</label>`).join("")}</div></details>`;
  box.querySelectorAll("[data-pp]").forEach(cb => cb.onchange = async () => { cfg[cb.dataset.pp] = cb.checked; const { error } = await sb.from("parent_portal_settings").upsert({ school_id: s.id, config: cfg, updated_at: new Date().toISOString() }); if (error) { cb.checked = !cb.checked; return toast(error.message); } toast("Saved"); });
  const copy = async t => { try { await navigator.clipboard.writeText(t); toast("Copied. Paste it into WhatsApp or an email."); } catch (_) { prompt("Copy:", t); } };
  box.querySelectorAll("[data-inv]").forEach(b => b.onclick = () => copy(invite(shown[+b.dataset.inv])));
  const sel = document.getElementById("ppCls"); if (sel) sel.onchange = e => { window.PP_CLASS = e.target.value; parentPortal(s); };
  const cc = document.getElementById("ppCopyCls"); if (cc) cc.onclick = () => copy(shown.filter(r => !r.parents.length).map(r => r.name + ": " + r.link).join("\n") || "Every family in this class has joined.");
  const sl = document.getElementById("ppSlips"); if (sl) sl.onclick = () => {
    const html = `<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif}td{border:1px dashed #999;padding:12px;width:50%;vertical-align:top;font-size:10.5pt}</style></head><body><table width="100%" cellspacing="6">${rows.reduce((a, x, i) => a + (i % 2 ? "" : "<tr>") + `<td><b>${esc(s.name)}</b> · Parent portal<br><br>For the parents of <b>${esc(x.name)}</b> (${esc(x.cls)})<br>Open this link on your phone and create your account:<br><b>${esc(x.link)}</b><br><br>Or go to ${esc(base)} and type the code <b style="font-size:14pt;letter-spacing:2px">${esc(x.code)}</b><br><br><span dir="rtl" lang="ar">افتح الرابط وأنشئ حسابك، وستتم إضافة طفلك تلقائيًا.</span></td>` + (i % 2 ? "</tr>" : ""), "")}${rows.length % 2 ? "<td></td></tr>" : ""}</table></body></html>`;
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + html], { type: "application/msword" })); a.download = "Parent portal invites.doc"; document.body.appendChild(a); a.click(); a.remove(); };
  const cv = document.getElementById("ppCsv"); if (cv) cv.onclick = () => { const q = v => '"' + String(v).replace(/"/g, '""') + '"', t = "\ufeff" + [["Student", "Class", "Parent code", "Invite link", "Joined"], ...rows.map(r => [r.name, r.cls, r.code, r.link, r.parents.length ? "Yes" : "No"])].map(r => r.map(q).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t], { type: "text/csv" })); a.download = "Parent portal invites.csv"; document.body.appendChild(a); a.click(); a.remove(); };
}
</script></body></html>
