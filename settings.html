<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings · Nestopia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--plum:#462D5B;--plum-2:#6A4B85;--plum-soft:#EDE6F5;--sage:#5E8455;--sage-soft:#E6EFE2;--amber:#A86C12;--amber-soft:#FBF0DC;--red:#B4473A;--red-soft:#F8E4E1;--blue:#4E6FB8;--blue-soft:#E4EBF8;--bg:#F7F4FB;--card:#FFFFFF;--ink:#2E2140;--muted:#6F6680;--line:#E4DDEE;--empty:#ECE7F3;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--plum:#CDB9EA;--plum-2:#DCCCF2;--plum-soft:#352A45;--sage:#A7C59A;--sage-soft:#26331F;--amber:#E6B566;--amber-soft:#3A2E17;--red:#E8897C;--red-soft:#3D2220;--blue:#9DB4E8;--blue-soft:#1E2A40;--bg:#17131D;--card:#221C2B;--ink:#F1ECF7;--muted:#B2A8C2;--line:#382F45;--empty:#2C2536;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--plum-2);outline-offset:2px}
h1,h2,h3,.btn,.brand{font-family:"Poppins","Nunito",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;font-size:22px;color:var(--plum);text-decoration:none}
header .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
main{max-width:1200px;margin:0 auto;padding:24px 20px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:18px}
.card h2{margin:0 0 8px;font-size:20px;color:var(--plum);font-weight:600}
.btn{border:0;background:var(--plum);color:#fff;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--bg);color:var(--plum);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.note{color:var(--muted);font-size:14px}
.msg{border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:600;font-size:14px;background:var(--red-soft);color:var(--red)}
.ptitle{margin:0 0 4px;font-weight:600;font-size:26px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.metric span{display:block;font-size:13px;color:var(--muted);font-weight:700}
.metric b{display:block;font-size:26px;color:var(--plum);font-family:Poppins,Nunito,sans-serif;font-weight:600;line-height:1.3}
.tablewrap{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:8px;min-width:100%}
table.grid th{font-size:13px;color:var(--muted);text-align:left;font-weight:700;padding:4px}
.cell{width:100%;min-width:150px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;display:block}
.cell:hover{border-color:var(--plum-2)}
.cell b{font-size:20px;font-family:Poppins,Nunito,sans-serif;font-weight:600;color:var(--plum)}
.cell small{display:block;color:var(--muted);font-size:12.5px}
.cell.none{cursor:default;color:var(--muted);background:var(--bg)}
.cell.on{outline:3px solid var(--plum-2)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--empty);margin:6px 0 4px}
.bar i{display:block;height:100%}
.bar .a{background:var(--sage)}.bar .t{background:var(--amber)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
h3.strand{font-size:16px;font-weight:600;margin:18px 0 6px;color:var(--ink)}
.obj{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.obj:last-child{border-bottom:0}
.st{font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px;justify-self:start}
.st.n{background:var(--empty);color:var(--muted)}.st.p{background:var(--amber-soft);color:var(--amber)}.st.t{background:var(--blue-soft);color:var(--blue)}.st.a{background:var(--sage-soft);color:var(--sage)}
.obj small{display:block;color:var(--muted);font-size:12.5px}
.sec{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.sec b{display:block;font-size:16px;color:var(--ink)}
@media (max-width:640px){.obj{grid-template-columns:1fr}.sec{text-align:left}}

.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.set .card{margin:0}
.set a.btn{margin-top:8px}
.code{font:inherit;font-size:22px;font-weight:800;letter-spacing:.18em;border:2px dashed var(--line);border-radius:12px;padding:8px 16px;background:var(--card);cursor:pointer}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mods span{font-size:13px;font-weight:700;border-radius:99px;padding:4px 10px;background:var(--plum-soft);color:var(--plum)}
.mods span.off{background:var(--empty);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:50}.toast.on{opacity:1}
</style></head><body>

<script>

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const ALL = [["twignest", "TwigNest"], ["grownest", "GrowNest"], ["planning", "Planning"], ["behaviour", "Behaviour"], ["inclusion", "Inclusion"], ["wellbeing", "Wellbeing"], ["evidence", "Evidence packs"], ["parents", "Parent portal"], ["conferences", "Parent conferences"]];
(async () => {
  const { data: { session } } = await sb.auth.getSession(); if (!session) { location.href = "./"; return; }
  const { data: p } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (!p || !p.school_id) { location.href = "./"; return; }
  who.innerHTML = `<span>${esc(p.full_name || p.email)}</span><a class="btn ghost small" href="./">← ${PLATFORM}</a>`;
  const { data: s } = await sb.from("schools").select("*").eq("id", p.school_id).single();
  const lead = ["school_lead", "coordinator", "admin"].includes(p.role), on = (s && s.modules) || [];
  if (!lead) { app.innerHTML = `<div class="phead"><div><h1 class="ptitle">Settings</h1><p class="note">Your account</p></div></div><section class="card" style="margin-bottom:16px"><h2 style="margin:0 0 8px">🔐 Two-step log-in</h2><div id="mfaBox"></div></section>${p.safeguarding_lead ? '<section class="card"><h2 style="margin:0 0 8px">🛡️ Access log</h2><div id="audBox"></div></section>' : ""}`;
    mfaCard(document.getElementById("mfaBox")); if (p.safeguarding_lead) auditCard(document.getElementById("audBox"), s); hubInit("settings"); return; }
  const c = (title, text, links) => `<section class="card"><h2>${title}</h2><p class="note" style="margin:0">${text}</p>${links.map(([h, l]) => `<a class="btn ghost small" href="${h}">${l} →</a>`).join(" ")}</section>`;
  app.innerHTML = `<div class="phead"><div><h1 class="ptitle">Settings</h1><p class="note">${esc(s.name)} · Everything you set up for your school, in one place.</p></div></div>
    <section class="card" style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2 style="margin:0">🩺 System health</h2><p class="note" style="margin:4px 0 0">Check that every file and update is installed. Run it after each update.</p></div><a class="btn" href="health.html">Run the health check</a></section>
    <section class="card" id="start" style="margin-bottom:16px"><h2>🚀 Getting started</h2><p class="note" style="margin:0 0 4px">The steps to get your school ready. Each one ticks itself off when it’s done.</p><div id="gs"><p class="note">Checking…</p></div></section>

    <div class="set" style="margin-bottom:16px"><section class="card"><h2 style="margin:0 0 8px">🔐 Two-step log-in</h2><div id="mfaBox"></div></section>
      <section class="card"><h2 style="margin:0 0 8px">🛡️ Access log</h2><div id="audBox"></div></section></div>
    <section class="card" id="plan" style="margin-bottom:16px"><h2 style="margin:0 0 8px">⭐ Your plan</h2><div id="planBody"><p class="note">Loading…</p></div></section>

    <div class="set">
      <section class="card"><h2>Your school</h2><p style="margin:0"><b>${esc(s.name)}</b>${s.country ? " · " + esc(s.country) : ""}</p>

        <p class="note" style="margin:8px 0 0">To switch more parts on, contact the Nestopia team.</p></section>
      ${on.includes("twignest") ? c("Staff and roles", "Approve teachers who join with your code, and choose their role: school leader, coordinator, teacher or buddy checker.", [["twignest/#staff", "Staff"]]) : ""}
      ${on.includes("twignest") ? c("Grades, subjects and assessment", "Your grades, subjects, terms, grading scale and student groups, used across Nestopia.", [["twignest/#setup", "Setup"], ["twignest/#classes", "Classes and students"]]) : ""}
      ${on.includes("grownest") ? c("Observations and appraisals", "GrowNest’s observation forms, criteria, staff and settings.", [["grownest/settings.html", "GrowNest settings"], ["grownest/criteria.html", "Criteria"], ["grownest/staff.html", "GrowNest staff"]]) : ""}
      ${on.includes("inclusion") ? c("Inclusion team", "Choose your inclusion head and the staff who manage the inclusion register.", [["inclusion.html", "Inclusion team (in Inclusion)"]]) : ""}
      ${on.includes("wellbeing") ? c("Wellbeing and safeguarding", "Choose your wellbeing team and your safeguarding lead(s). Only they, and school leaders, see safeguarding concerns.", [["wellbeing.html", "Wellbeing team (in Wellbeing)"]]) : ""}

// ----- Two-step log-in for this account -----
async function mfaCard(box){
  if (!box || !sb.auth.mfa) return;
  const { data: fs, error } = await sb.auth.mfa.listFactors();
  if (error) { box.innerHTML = '<p class="note">Two-step log-in isn’t available right now.</p>'; return; }
  const on = ((fs && fs.totp) || []).find(x => x.status === "verified");
  if (on) { box.innerHTML = '<p style="margin:0;color:#3F8A4B;font-weight:800">✅ Two-step log-in is on for your account.</p><p class="note">Each time you sign in, you type a code from your authenticator app.</p><button class="btn ghost small" id="mfaOff">Turn it off</button>';
    document.getElementById("mfaOff").onclick = async () => { if (!confirm("Turn off two-step log-in? Your account will be less protected.")) return; const { error: e } = await sb.auth.mfa.unenroll({ factorId: on.id }); if (e) return toast(e.message); toast("Two-step log-in is off."); mfaCard(box); }; return; }
  box.innerHTML = '<p class="note" style="margin-top:0">Protect your account: after your password, you also type a 6-digit code from an app on your phone (Google Authenticator, Microsoft Authenticator or Authy). We strongly recommend it for anyone who sees safeguarding or inclusion records.</p><button class="btn small" id="mfaOn">Turn on two-step log-in</button>';
  document.getElementById("mfaOn").onclick = async () => {
    for (const x of ((fs && fs.totp) || []).filter(x => x.status !== "verified")) { try { await sb.auth.mfa.unenroll({ factorId: x.id }); } catch (_) {} }
    const { data: en, error: e } = await sb.auth.mfa.enroll({ factorType: "totp", friendlyName: "Nestopia " + Date.now() });
    if (e) return toast(/disabled|not enabled/i.test(e.message || "") ? "Two-step log-in needs switching on in Supabase first (Authentication → Multi-factor)." : e.message);
    box.innerHTML = `<ol class="note" style="line-height:1.7;margin-top:0"><li>Open your authenticator app and scan this code, or type the key below.</li><li>Type the 6-digit code it shows.</li></ol>
      <img src="${en.totp.qr_code}" alt="QR code for your authenticator app" style="width:170px;height:170px;background:#fff;border-radius:12px;padding:6px;border:1px solid var(--line)">
      <p class="note">Key: <code style="word-break:break-all">${esc(en.totp.secret)}</code></p>
      <input id="mfaCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code" style="max-width:180px;font-size:18px;letter-spacing:.2em;padding:8px 10px;border:1px solid var(--line);border-radius:10px">
      <button class="btn small" id="mfaChk">Check and turn on</button>`;
    document.getElementById("mfaChk").onclick = async () => { const { error: ve } = await sb.auth.mfa.challengeAndVerify({ factorId: en.id, code: document.getElementById("mfaCode").value.replace(/\s+/g, "") });
      if (ve) return toast("That code didn’t work. Try the newest code in the app."); toast("🔐 Two-step log-in is on."); mfaCard(box); };
  };
}
// ----- Access log: who viewed or changed sensitive records -----
async function auditCard(box, s){
  if (!box) return;
  const AREA = { safeguarding: "🔒 Safeguarding", wellbeing: "Wellbeing", inclusion: "Inclusion", iep: "IEP / plan", referral: "Inclusion referral", student: "Student profile", behaviour: "Behaviour file" };
  const ACT = { viewed: "viewed", added: "added", changed: "changed", deleted: "deleted" };
  const r = await sb.from("audit_log").select("*").eq("school_id", String(s.id)).order("at", { ascending: false }).limit(300);
  if (r.error) { box.innerHTML = /audit_log/.test(r.error.message) ? '<p class="note">The access log needs its database step first. Please run the Privacy and safety update in Supabase.</p>' : `<p class="note">${esc(r.error.message)}</p>`; return; }
  const rows = r.data || [], ids = [...new Set(rows.map(x => x.student_id).filter(Boolean))], names = {};
  for (let k = 0; k < ids.length; k += 200) { const { data } = await sb.from("students").select("id,full_name").in("id", ids.slice(k, k + 200)); (data || []).forEach(x => names[x.id] = x.full_name); }
  const draw = q => { const t = q.toLowerCase(), list = rows.filter(x => !t || [x.actor_name, names[x.student_id], AREA[x.area]].join(" ").toLowerCase().includes(t)).slice(0, 120);
    box.querySelector("#audList").innerHTML = list.length ? `<div class="tablewrap" style="max-height:340px;overflow:auto"><table class="reg" style="width:100%">${list.map(x => `<tr><td style="white-space:nowrap" class="note">${new Date(x.at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</td><td><b>${esc(x.actor_name || "Someone")}</b> ${ACT[x.action] || x.action} <b>${esc(AREA[x.area] || x.area)}</b>${x.student_id ? " · " + esc(names[x.student_id] || "a student") : ""}</td></tr>`).join("")}</table></div>` : '<p class="note">Nothing yet.</p>'; };
  box.innerHTML = `<p class="note" style="margin-top:0">Every time someone opens or changes a safeguarding, wellbeing or inclusion record, it’s written here. Entries can’t be edited or deleted.</p><input type="search" id="audQ" placeholder="Search a staff member or student" style="max-width:280px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit"><div id="audList" style="margin-top:10px"></div>`;
  draw(""); box.querySelector("#audQ").oninput = e => draw(e.target.value);
}
async function planCard(s, me){
  const box = document.getElementById("planBody"); if (!box) return;
  const { data: plans, error } = await sb.from("nest_plans").select("*").eq("active", true).order("sort");
  if (error) { box.innerHTML = '<p class="note">Plans aren’t set up yet.</p>'; return; }
  const mine = (plans || []).find(x => x.id === s.plan_id), ST = { trial: "Free trial", active: "Active", past_due: "Payment due", cancelled: "Cancelled" };
  const { data: rq } = await sb.from("plan_requests").select("plan_id,status,created_at").eq("school_id", String(s.id)).eq("status", "pending");
  const pending = (rq || [])[0];
  const trialLeft = s.trial_ends ? Math.ceil((new Date(s.trial_ends + "T00:00:00") - new Date()) / 864e5) : null;
  box.innerHTML = `<p style="margin:0"><b style="font-size:20px">${esc(mine ? mine.name : "No plan chosen yet")}</b> <span class="note">· ${ST[s.subscription_status] || "Free trial"}</span></p>
    ${(s.subscription_status || "trial") === "trial" && trialLeft != null ? `<p style="margin:6px 0 0;color:${trialLeft < 0 ? "#B4473A" : trialLeft <= 7 ? "#A86C12" : "inherit"}">${trialLeft < 0 ? "Your free trial has ended. Choose a plan below to keep using Nestopia." : `Your free trial ends in <b>${trialLeft} day${trialLeft === 1 ? "" : "s"}</b> (${esc(s.trial_ends)}).`}</p>` : ""}
    ${s.renews_on ? `<p class="note" style="margin:4px 0 0">Renews on ${esc(s.renews_on)}</p>` : ""}
    ${pending ? `<p class="note" style="margin:8px 0 0">⏳ You asked to change to <b>${esc(((plans || []).find(x => x.id === pending.plan_id) || {}).name || "another plan")}</b>. The Nestopia team will confirm it soon.</p>` : ""}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px">${(plans || []).map(pl => `<div style="border:2px solid ${pl.id === s.plan_id ? "var(--plum)" : "var(--line)"};border-radius:14px;padding:12px 14px;background:var(--card)">
      <b>${esc(pl.name)}</b>${pl.highlight ? ' <span class="mods"><span>Most popular</span></span>' : ""}<br><span class="note">${esc(pl.price_text || "")}</span>
      <ul class="note" style="margin:8px 0;padding-left:18px">${(pl.features || []).map(f => `<li>${esc(f)}</li>`).join("")}</ul>
      ${pl.id === s.plan_id ? '<b style="color:var(--plum)">✓ Your plan</b>' : me.role === "school_lead" && !pending ? `<button class="btn ghost small" data-req="${pl.id}">Request this plan</button>` : ""}</div>`).join("")}</div>`;
  box.querySelectorAll("[data-req]").forEach(b => b.onclick = async () => { const note = prompt("Anything we should know? (optional, for example: number of students)", ""); if (note === null) return;
    const { error: e2 } = await sb.from("plan_requests").insert({ school_id: String(s.id), plan_id: b.dataset.req, requested_by: me.id, note: note.trim() || null });
    if (e2) return toast(e2.message); toast("Request sent. The Nestopia team will confirm it."); planCard(s, me); });
}
</script></body></html>
